[package]
name = "revue-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Revue TUI framework"
license = "MIT"
repository = "https://github.com/user/revue"
keywords = ["tui", "cli", "terminal", "ui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "revue"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dialoguer = "0.12.0"
indicatif = "0.18.6"
toml = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
walkdir = "2.5.0"
include_dir = "0.7.4"
handlebars = "6.4.4"
ureq = { version = "2.12.1", features = ["json"] }
urlencoding = "2.1.3"

[workspace]

[dev-dependencies]
tempfile = "3.27.0"
