# The fault-injection layers assert wall-clock limits: a case that does not
# finish in time is reported as a hang. Next to a CPU-bound test they fail
# without any bug: the widget catalog's sequences once drove every widget on
# its own thread, ~100 busy threads on a 4-core CI runner, and the fault
# cases' worker threads were not scheduled within their limits (#923). The
# sequences now use one worker per core (#938), but any CPU-bound test still
# takes cores the fault cases count on. Each fault test takes every test
# slot, so nothing runs beside it.
# The stress tests share the binary but assert no wall-clock limits.
[[profile.default.overrides]]
filter = 'binary(fault) & not test(/^stress::/)'
threads-required = 'num-test-threads'
