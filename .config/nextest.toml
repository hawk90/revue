# The fault-injection layers assert wall-clock limits: a case that does not
# finish in time is reported as a hang. Next to a CPU-bound test they fail
# without any bug. The widget catalog's sequences drive every widget on its
# own thread, so their two tests keep ~100 busy threads on a 4-core CI runner
# for ~20s, and
# the fault cases' worker threads do not get scheduled within their limits
# (#923). Each fault test takes every test slot, so nothing runs beside it.
# The stress tests share the binary but assert no wall-clock limits.
[[profile.default.overrides]]
filter = 'binary(fault) & not test(/^stress::/)'
threads-required = 'num-test-threads'
