  - id: LAY-006
    title: Content-sized stack children (View::measure, Stack::content_sized)
    area: layout
    priority: P1
    priority_inferred: true
    status: done
    acceptance:
      - a view can report the size it wants (View::measure); None keeps "fill what I am given"
      - by default (3.0) an unsized child that measures gets that size; children that fill share the rest;
        content_sized(false) restores the 2.x equal shares
      - child_sized / child_flex still win
      - measured children that overflow the stack shrink in proportion to their size; fixed ones do not
      - Text, Border and Stack measure themselves
      - a view can say which axes it fills (View::fills); in a content-sized stack a child that fills the main axis
        shares the leftover like one that does not measure, unless an explicit CSS main-axis size is set
      - the common fixed-size widgets measure what they paint (buttons, badges, tags, checkboxes, switches, radios,
        spinners, ...), stretchy one-row widgets answer one row of the offered width, and multi-row widgets answer
        from their height() helpers
      - under css_layout, a measured child's main-axis CSS box (height/width, min/max, margins) is folded into its
        slot; display none takes no space or gap
      - a nested stack is measured with the CSS inside it (its gap, its children's boxes, at any depth); another
        measuring widget whose subtree adds CSS spacing fills instead of clipping
      - a flex-wrap row in a content-sized parent shows every line, each as tall as its tallest item
    evidence:
      - src/widget/traits/view.rs::measure
      - src/widget/layout/stack.rs::content_sized
      - tests/content_sized_stack.rs::a_column_stacks_text_line_after_line
      - tests/content_sized_stack.rs::every_constructor_is_content_sized_by_default
      - tests/content_sized_stack.rs::turning_the_flag_off_shares_equally
      - tests/content_sized_stack.rs::a_body_too_tall_shrinks_instead_of_pushing_the_footer_off
      - tests/content_sized_stack.rs::a_child_that_fills_gets_what_the_measured_ones_leave
      - tests/content_sized_stack.rs::a_switch_and_its_label_sit_side_by_side
      - tests/widget_measure.rs::assert_measures_paint
      - src/widget/traits/view.rs::fills
      - tests/content_sized_stack.rs::a_progress_bar_takes_the_row_the_brackets_leave
      - tests/content_sized_stack.rs::two_fillers_in_a_row_split_the_leftover
      - tests/content_sized_css.rs::an_explicit_width_beats_a_child_that_fills_the_row
      - tests/widget_size_agreement.rs::measure_answers_with_the_height_helpers
      - tests/content_sized_css.rs::a_margin_top_pushes_the_text_down_and_keeps_it_visible
      - tests/content_sized_css.rs::a_height_reserves_its_rows_and_the_next_sibling_starts_after_them
      - tests/content_sized_css.rs::a_hidden_child_takes_no_space
      - tests/content_sized_nested_css.rs::the_inner_stacks_css_gap_is_reserved
      - tests/content_sized_nested_css.rs::spacing_two_levels_down_is_reserved
      - tests/content_sized_nested_css.rs::a_wrapper_around_styled_spacing_fills_instead_of_clipping
      - tests/flex_wrap_content_sized.rs::a_wrapping_row_takes_as_many_lines_as_it_needs
    source:
      - PR #687
    notes: Opt-in in 2.x; on by default since 3.0 (docs/migration/v3.0.0.md section 2). Widgets without an obvious
      natural size (lists, tables, editors, charts, Positioned, Gauge Arc/Circle) fill by design. Design and the
      list of widgets that measure in docs/refactor/design-content-sized-stack.md.
      Nested stacks are measured through the crate-internal View::measure_styled hook with the paint pass's
      styled subtree (design doc section 3).
