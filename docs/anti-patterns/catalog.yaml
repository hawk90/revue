    title: "Untrusted CSS Resource Exhaustion"
    category: security
    review_tag: SEC
    status: observed
    assumes: [css]
    summary: "비정상적으로 깊은 selector, 거대한 grid, 많은 animation, 변수 확장 등을 제한하지 않는다. parser 성공과 안전한 실행은 별개다."
