  - id: REV-WIDGET-010
    title: "100 Widgets, No Maturity Tier"
    category: widget
    review_tag: WIDGET
    status: observed
    assumes: [widget-library, public-api]
    decisions: ["#1146"]
    summary: "실험적인 widget과 안정적인 widget이 같은 수준으로 노출된다."
    fix:
      - "tier는 stable과 experimental 두 개에 `#[deprecated]`를 더한다. stable은 prelude에 있고 4.x에서 깨지지 않는다. experimental은 `revue::experimental` module 경로로만 쓰고 minor에서 바뀔 수 있다 (#1146)."
      - "stable로 올리는 조건은 측정한다: widget matrix, event sequence, fault injection을 `KNOWN` 없이 통과하고, 4.0 계약(part, event, state 분리, private props)을 지키며, 문서 예제가 prelude만으로 컴파일된다. CI가 후보를 보고하고 사람이 올린다."
    observed:
      - "2026-10-20: src에 tier 표시가 없고 `mod experimental`도 없다. STABILITY.md는 API 몇 개만 등급을 매기고 widget은 다루지 않는다. 2026-08 기준 widget export 414개 중 115개가 기준 없이 prelude에 있었다 (docs/refactor/findings-prelude-coverage.md)."
  - id: REV-WIDGET-011
    title: "Selection Kept as a Position"
    category: widget
    review_tag: WIDGET
    status: observed
    assumes: [widget-library]
    decisions: ["#1141"]
    summary: "collection widget이 선택을 항목의 식별자가 아니라 화면상의 위치(index)로만 들고, 목록이 바뀔 때(정렬, 필터, 삽입, 오래된 항목 잘라내기, 펼치기·접기) 그 위치를 다시 계산하지 않는다."
    problem:
      - "목록이 바뀐 뒤 같은 위치에 있는 다른 항목이 선택된다. 사용자는 선택을 옮긴 적이 없다."
      - "선택한 항목에 대한 동작(복사, 북마크, 펼치기)이 다른 항목에 적용된다."
      - "검색 결과나 다중 선택처럼 위치로 저장한 다른 상태도 같이 어긋난다."
    detect:
      - "`selected: usize`만 있고, `sort`/`set_filter`/`push`(최대 개수로 자르기)/`expand`/`collapse`가 그 값을 건드리지 않는다"
      - "검증 입력: 항목을 선택한 뒤 정렬·필터 해제·앞쪽 항목 제거·위쪽 노드 펼치기를 하고 `selected_*()`가 같은 항목을 돌려주는지 본다"
    fix:
      - "선택은 항목의 안정된 식별자(key)로 들거나, 위치로 들 때는 목록을 바꾸는 모든 경로에서 선택한 항목의 새 위치를 다시 계산한다(Qt의 selection model이 persistent index로 정렬·삽입 뒤에도 같은 행을 따라가는 것과 같은 원리)."
      - "그 항목이 사라졌으면 가장 가까운 항목으로 옮기고, 사라진 것을 선택한 채로 두지 않는다."
      - "`utils::KeyedSelection`이 이 규칙이다 (#975 결정, 2026-10-22): 선택은 항목의 key를 들고, 목록이 바뀌면 `sync(keys)`로 다시 찾는다. 식별자가 없는 목록은 index를 key로 쓴다(Vue의 `:key` 없는 `v-for`)."
      - "선택 상태는 widget 밖의 상태 타입이다 (#1141)."
    observed:
      - "csv_viewer 정렬 뒤 선택과 검색 결과 (#856, #970에서 고침), tree 펼치기·접기 뒤 다중 선택과 검색 결과 (#859), log_viewer 오래된 항목 잘라내기와 `clear_filter` 뒤 선택 (#975), datagrid 정렬 뒤 선택 (#975)."
      - "timeline 감사(2026-10-13): Timeline의 `select(Some(i))`는 범위 밖 번호도 그대로 두고, 빈 목록에서 `select_next`가 `len() - 1`을 계산해 debug에서 panic한다 (#975 댓글)."
      - "줄어드는 쪽에서 index를 다시 자르지 않는 것이 event sequence에서 가장 흔한 원인이었다: clear, filter, remove, collapse 뒤 선택, tag cursor, 검색 결과, drag, 보조 cursor가 범위 밖에 남았다 (widget 8개, docs/refactor/findings-event-sequences.md)."
  - id: REV-WIDGET-012
    title: "Every Widget Has Its Own Line Editor"
    category: widget
    review_tag: WIDGET
    status: observed
    assumes: [widget-library]
    decisions: ["#1141"]
    summary: "텍스트 칸이 있는 widget마다 편집(문자 삽입, 삭제, 커서 이동, 선택, undo, char→byte 변환)을 따로 짠다. 공통 model `utils::EditState`(#1261)가 있는데 쓰지 않는다."
    problem:
      - "같은 키가 widget마다 다르게 동작한다: 제어 문자를 넣는 곳과 버리는 곳, Ctrl+글자를 입력하는 곳과 앱에 넘기는 곳, 단어 이동·선택·undo가 있는 곳(Input)과 없는 곳."
      - "한 widget에서 고친 편집 결함이 다른 widget에는 그대로 남는다."
      - "char→byte 변환도 여러 벌이라 byte index 실수가 widget마다 따로 생길 수 있다."
    detect:
      - "widget에 `String` 값과 `cursor: usize`가 있고 `Key::Char`/`Key::Backspace`/`Key::Delete`를 직접 처리한다"
      - "`char_indices().nth(cursor)`를 인라인으로 쓰거나 `char_to_byte_index`를 widget 안에 다시 정의한다"
      - "widget이 글자를 돌며 커서나 선택 칸을 직접 칠한다 (`put_edit_field` 대신)"
      - "검증 입력: 같은 키 열(제어 문자, Ctrl+글자, ←→ Home End, 넓은 글자, 칸보다 긴 값)을 여러 widget에 넣고 결과를 비교한다"
    fix:
      - "편집은 `utils::EditState` 하나로 한다. 한 줄 칸과 여러 줄 편집기가 같은 model을 쓰고(한 줄 칸은 single_line), 표준 키 처리(삽입 규칙, 삭제, 이동, 단어 단위, 선택, undo)는 `edit_key`에 두며 widget은 자기 키를 먼저 처리하고 나머지를 넘긴다. `utils::TextBuffer`는 3.12에서 deprecated, 4.0에서 제거된다."
      - "그리기는 공통 `EditField`/`put_edit_field`(`put_edit_line`/`scroll_to_cursor` 위)로 해서 긴 값도 커서를 따라 scroll하고 선택과 placeholder 위 커서를 칸마다 같게 그린다."
      - "widget 고유 규칙(NumberInput의 숫자만 받기, spin button의 Home/End, CodeEditor의 자동 들여쓰기)은 EditState 바깥에서 감싼다."
    observed:
      - "2026-10-13 기준 커서가 있는 한 줄 편집기 7개(Input, Combobox, Autocomplete, SearchBar, MaskedInput, NumberInput, DataGrid 셀 편집)가 모두 따로 짜여 있고 TextBuffer를 쓰는 widget은 0개다. char→byte 변환은 4가지 방식이 섞여 있다. 목록은 #985."
      - "2026-10-24: 한 줄 칸 7개(Input, SearchBar, Combobox, Autocomplete, MaskedInput, NumberInput, DataGrid 셀)가 모두 `EditState`로 편집하고 `EditField`/`put_edit_field`로 그린다 (#1284, #1291, #1294). 위젯 안 char→byte 변환은 Input `substring`과 MaskedInput `byte_at`이 남았다(EditState가 `&str` 범위를 주지 않아서). 남은 편집기는 TextArea와 CodeEditor(#1261), 덧붙이기만 하는 검색 칸들(#985)."
      - "2026-10-24: TextArea가 `EditState`로 편집한다. 자기 키(Tab, 찾기, 여러 커서 추가, 화면 단위 PageUp/PageDown, Ctrl+Shift+K)를 먼저 처리하고 나머지는 `edit_key`로 넘긴다. Shift 선택(#1252), 모든 커서에서의 편집(#1006), 커서를 되돌리는 undo(#1251), 여러 줄 삭제(#1253)가 이것으로 고쳐졌다. 남은 여러 줄 편집기는 CodeEditor."
      - "2026-10-24: Select와 MultiSelect의 검색어가 `EditState`로 편집되고 `put_edit_field`로 커서와 함께 그려진다 (#985). MultiSelect는 검색어를 오른쪽 화살표 칸까지 넘겨 그리던 것도 고쳤다. CommandPalette는 `pub query: String`이라 4.0으로 미룬다. 남은 덧붙이기 칸: Tree 검색, CodeEditor 찾기/줄 이동, ColorPicker hex, FilePicker 이름, Terminal 입력."
      - "2026-10-24: CodeEditor 찾기·줄 이동 칸과 Terminal 명령 줄도 `EditState`로 편집하고 커서와 함께 그린다. Terminal의 Home은 줄을 지우던 것을 readline처럼 줄 처음으로 옮기는 것으로 바꿨다(맨 아래로 스크롤은 Ctrl+End). 편집 칸이 아닌 것으로 정했다: Tree의 입력 검색(검색어가 보이지 않는다), ColorPicker의 여섯 칸 hex 입력. FilePicker는 파일 이름 키 처리가 아예 없다."
      - "2026-10-24: CodeEditor가 자기 줄·커서·undo(`EditOp`)를 버리고 `EditState`로 편집한다 (#1261). 자동 들여쓰기와 닫는 괄호도 model을 거치는 편집(`insert`, `insert_pair`)이라 undo 한 단계로 함께 되돌려진다(#892). 읽기 전용과 들여쓰기 0 검사도 model과 한 곳에 있다(#1080). 셀렉션 모드(`start_selection` 뒤 모든 이동이 선택을 늘림)는 3.x 호환으로 유지했다."
  - id: REV-WIDGET-013
    title: "Chrome Drawn Over Content"
    category: widget
    review_tag: WIDGET
    status: observed
    assumes: [widget-library, cell-grid]
    decisions: ["#1144"]
    summary: "scrollbar, scroll marker, 위치 표시(n/total), mode badge 같은 chrome을 widget이 내용 영역 안에 덧그린다. chrome 칸을 내용 영역에서 먼저 빼 두지 않아서 chrome이 내용을 가리거나 내용이 chrome을 덮는다."
    problem:
      - "긴 값이나 줄바꿈한 줄의 끝이 badge나 marker에 가려 보이지 않는다."
      - "그리는 순서에 따라 반대로 내용이 scrollbar를 지운다."
      - "chrome이 행의 배경을 모르고 자기 배경으로 칠해서 선택 행 위에서 어색하게 보인다."
    detect:
      - "`ctx.set(area.width - 1, ..)`나 `width - len - 1`에 chrome을 그리는데, 같은 줄의 내용 너비는 `width - prefix`처럼 마지막 열까지 쓴다"
      - "scrollbar 칸을 일부 경우(auto 너비 column이 있을 때)에만 빼 둔다"
      - "검증 입력: 마지막 열까지 닿는 값, 스크롤이 생길 만큼 많은 행, tail/preview/scrolled-back 같은 상태 표시가 켜진 상태에서 chrome 칸의 symbol을 확인한다"
    fix:
      - "chrome 칸을 먼저 떼어 내고 남은 영역에 내용을 그린다 (`ScrollView::content_area`, VirtualList의 `width - 1` content가 이미 이렇게 한다)."
      - "scrollbar와 gutter는 공통 helper 하나로 그리고 widget마다 thumb 계산이나 칸 예약을 손으로 짜지 않는다 (#973의 `utils::Selection` 옆)."
      - "counter와 badge는 같은 분할에서 자기 줄이나 열을 받거나, border나 status 줄로 옮긴다."
      - "4.0에서는 border box와 part가 chrome 칸을 layout으로 나눈다 (#1144, #1145)."
    observed:
      - "2026-10-13 기준 chrome이 내용과 겹치는 widget 6개: DataGrid 행 표시, LogViewer scroll marker와 TAIL badge, RichLog scroll marker, Terminal `↑N`, MarkdownPresentation PREVIEW, Table scrollbar(고정 너비 column이 영역을 다 채울 때). 칸을 먼저 빼 두는 widget: ScrollView, VirtualList, Combobox, CodeEditor. 목록은 #988."
      - "chart 감사(2026-10-13): Chart와 ScatterChart의 범례 상자가 plot 안에 그려져 그 아래 선과 점을 가린다 (#988, #990)."
  - id: REV-WIDGET-014
    title: "Every Chart Has Its Own Axis"
    category: widget
    review_tag: WIDGET
    status: observed
    assumes: [widget-library]
    summary: "차트 widget마다 범위 계산, 값→칸 변환, 눈금, 눈금 라벨, 격자, 축 제목, 범례 배치를 따로 짠다. 공통 틀이 있어도 일부만 쓰므로 같은 `Axis` 설정이 차트마다 다른 뜻이 되고 같은 버그가 차트마다 다른 모양으로 반복된다."
    problem:
      - "`Axis::ticks(0)`이 어떤 차트에서는 panic, 어떤 차트에서는 `NaN` 라벨, 어떤 차트에서는 무시된다."
      - "범위가 작을 때 `.max(1.0)`으로 막은 차트는 데이터가 한쪽으로 찌그러지는데 라벨은 실제 범위를 표시한다."
      - "라벨 행과 데이터 행, 마지막 눈금 위치가 차트마다 한 칸씩 다르게 어긋난다."
      - "축 밖 값을 차트마다 다르게 다룬다: 잘라 내거나, 가장자리에 붙이거나, `u16` 뺄셈에서 panic한다."
      - "같은 데이터를 두 차트(Chart의 scatter와 ScatterChart)로 그리면 눈금 위치와 라벨 형식이 다르다."
    detect:
      - "차트 파일 안에 `i as u16 * width / ticks`, `/ 4.0`, `(max - min).max(1.0)` 같은 눈금·범위 계산이 있다"
      - "`chart_render`를 import하지 않거나 `render_title`/`fill_background`만 쓰는 차트"
      - "검증 입력: `ticks(0)`과 큰 `ticks`, 데이터 한 개, 같은 값만 있는 데이터, 범위 1 미만, 고정 범위 밖의 값, 빈 데이터, 좁은 폭"
    fix:
      - "범위(유한 값만, 0 범위 넓히기, 여백 규칙 하나), 값→칸 변환(`f64`로 하고 범위 밖은 자르거나 버림), 눈금(`ticks` ≥ 1, 양 끝 포함), 라벨(`Axis::format_value`), 배치(제목·라벨·범례 칸을 먼저 떼고 남은 곳이 plot)를 `chart_common`의 모델 하나로 둔다."
      - "`chart_render`가 그 모델로 격자, 라벨, 제목, 범례를 그리고 각 차트는 자기 mark만 그린다."
      - "새 차트를 만들 때 축 그리기를 따로 짜지 않는다. 모델이 감당하지 못하는 경우(시간 축, 범주 축)는 모델을 넓힌다."
    observed:
      - "2026-10-13 기준 축이 있는 차트 9개 중 공통 틀을 대부분 쓰는 것은 ScatterChart 하나다. Histogram·BoxPlot·PieChart는 제목과 배경만, Chart·TimeSeries·CandleChart·BarChart·Sparkline·Waveline은 하나도 쓰지 않는다. 공통 틀 자체에도 버그가 있다(마지막 x 라벨이 영역 밖, 축 제목이 x 라벨을 덮음, 배경을 box 배경으로 등록하지 않음). 목록은 #990."
