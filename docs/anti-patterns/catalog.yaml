      - "error handling"
      - "large list"
      - "modal/focus"
      - "background task"
      - "testing"
      - "performance diagnosis"
      - "custom widget lifecycle"
    source_labels: ["필수 고급 문서"]
  - id: REV-DOC-003
    title: "Unsupported Behavior Left Ambiguous"
    category: documentation
    review_tag: DOC
    summary: "CSS나 terminal 기능을 “비슷하게 지원”한다고만 쓰고 정확한 차이를 설명하지 않는다. compatibility matrix가 필요하다."
  - id: REV-PROJ-001
    title: "Core and Showcase Develop at Same Pace"
    category: project
    review_tag: PROJ
    summary: "실제 core 안정성보다 새로운 showcase widget 개발이 더 빠르다. core quality gate를 통과한 뒤 feature를 추가해야 한다."
  - id: REV-PROJ-002
    title: "Number of Widgets as Primary KPI"
    category: project
    review_tag: PROJ
    summary: "widget 개수가 framework 품질로 취급된다."
    fix:
