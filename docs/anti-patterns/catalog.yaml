  - id: REV-SEC-001
    title: "Terminal Escape Injection"
    category: security
    review_tag: SEC
    status: observed
    assumes: [cell-grid]
    decisions: ["#1148"]
    summary: "사용자 문자열을 sanitize하지 않고 terminal에 출력한다. 로그·채팅·파일 viewer에서 escape sequence가 실행될 수 있다. 모든 외부 text는 control character 정책을 통과해야 한다."
    fix:
      - "control character 정책은 공통 text helper 한 곳에 둔다. Element는 글자를 그 helper로만 그린다 (#1148)."
    observed:
      - "2026-10-13 기준 control character 정책이 없다. 문자를 하나씩 그리는 widget은 `char_width`가 0인 `\\n`·`\\t`를 다음 문자로 덮어써 앞뒤 단어가 붙는다(Timeline 설명 `Line 1Line 2`). 정책은 공통 text helper 한 곳에 두는 것이 맞다 (#982 댓글)."
      - "반대 모양도 있다. RichText(그리고 RichText로 그리는 Text)는 `UnicodeWidthChar::width(ch).unwrap_or(1)`로 control character에 한 칸을 주고 cell에 그대로 넣는다. terminal writer는 `\\t`·`\\r`·ESC를 그대로 출력한다(`Text::new(\"ab\\rcd\")` → `ab\\r\\e[1;4Hcd`). 바로 뒤에 cursor 이동이 오기 때문에 지금은 그 칸만 칠해지지 않는다 (richtext/text 감사, #982 댓글)."
      - "INV-07 테스트는 `ctx.draw_text`만 확인하고 RichText 경로는 확인하지 않는다 (tests/e2e/invariants.rs)."
      - "2026-10-24: RichText는 control character를 건너뛰고(`char_width`가 0) 공통 ANSI scanner를 쓴다 (3.12). 링크 URL의 control character는 `Buffer::register_hyperlink`가 percent-encoding한다 — 전에는 `[link=x\\x1bc]`가 OSC 8을 끝내고 RIS를 실행했다."
  - id: REV-SEC-002
    title: "OSC Sequence Trust"
    category: security
    review_tag: SEC
    status: observed
    assumes: [cell-grid]
    summary: "clipboard, hyperlink, title 변경 등 OSC sequence를 무제한 허용한다. capability와 opt-in 정책이 필요하다."
    observed:
      - "terminal 감사(#930): Terminal 위젯은 OSC payload를 실행하지 않고 버린다(title·clipboard 변경 없음). 대신 끝을 BEL이나 `\\` 하나로 판단해, `\\`가 들어간 title이나 OSC 8 link는 중간에 끝나고 나머지가 글자로 찍힌다. `ESC ] BEL`은 첫 바이트로 BEL을 삼켜 끝나지 않으므로 그 뒤의 출력이 모두 사라진다 (#878 댓글)."
      - "2026-10-24: Terminal은 공통 `utils::ansi::Scanner`를 쓴다(#1279, #1293): ST는 `ESC \\`이고 `ESC ] BEL`은 바로 끝난다. 위의 두 결함은 고쳐졌다."
