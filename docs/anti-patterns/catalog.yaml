    review_tag: API
    status: observed
    assumes: [public-api, retained-tree]
    decisions: ["#1140"]
    summary: "shortcut API가 정상 lifecycle·validation·invalidation 절차를 우회한다. 모든 API는 동일한 내부 transaction path를 통과해야 한다. 사용자가 고르는 입구(builder, CSS)는 모두 같은 뜻을 가진다."
    fix:
      - "입구마다 같은 model(engine 하나, cascade 하나, 우선순위 하나)로 간다. 편의 API가 그것을 건너뛰지 않는다."
      - "4.0에서 자식은 render가 돌려준 node이고 `child.render(ctx)`로 직접 그리는 길이 없다 (#1140)."
    observed:
