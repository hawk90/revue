    assumes: [reactive, retained-tree]
    decisions: ["#1140"]
    summary: "Signal이 바뀌어도 framework가 화면을 다시 그리지 않는다. 다시 그릴지는 app의 event handler가 돌려주는 `bool`이 정한다. reactive라는 이름만 있고 화면과는 연결되지 않은 상태다."
    problem:
      - "worker나 timer가 Signal을 바꾸면 다음 입력이 올 때까지 화면이 그대로다."
