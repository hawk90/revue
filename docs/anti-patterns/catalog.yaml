  - id: REV-ASYNC-005
    title: "Blocking I/O Disguised as Async"
    category: async
    review_tag: ASYNC
    status: hypothesis
    assumes: [workers]
    decisions: ["#1143"]
    summary: "worker API가 있다는 이유로 모든 blocking 작업을 같은 pool에 넣는다. CPU-bound와 I/O-bound 작업을 동일 pool에 두면 starvation이 발생할 수 있다."
    fix:
      - "CPU 작업과 오래 막히는 I/O를 다른 경로로 보낸다. pool이 작을수록(#1143의 min(core 수, 약 4)) 중요하다. #1143: 오래 막히는 작업은 계산용 pool이 아닌 blocking lane으로 보내고, lane에도 thread 상한, bounded queue, 취소, generation으로 낡은 결과 버리기를 똑같이 둔다. `async` feature에서는 tokio의 blocking pool이 그 lane이다."
    checked:
      - "2026-10-20: WorkerPool 하나에 priority queue 하나이고 I/O와 CPU를 나누지 않는다. 내장 코드가 이 pool에 blocking I/O를 보내는 곳은 없다(HttpClient는 backend를 부르지 않고, FilePicker는 UI thread에서 읽는다). starvation 사례는 없다."
  - id: REV-ASYNC-006
    title: "No Panic Boundary"
    category: async
    review_tag: ASYNC
    status: observed
    assumes: [workers]
    decisions: ["#1143", "#1149"]
    summary: "worker closure panic이 runtime 전체를 손상시키거나 조용히 사라진다."
    fix:
      - "task result는 최소한 success, application error, cancellation, panic, shutdown을 구분한다."
      - "`catch_unwind`는 `panic = \"abort\"` build에서 아무것도 잡지 못한다. 그 profile은 앱이 정하므로, 격리가 필요하면 문서로 알린다."
    observed:
      - "fault injection이 찾아 고쳤다: `WorkerHandle::spawn`이 panic을 잡지 않아 상태가 영원히 `Running`이었고, WorkerPool task의 panic이 worker thread를 죽여 마지막 worker가 죽으면 queue가 멈췄으며, panic payload가 `Any { .. }`로 찍혔다. 지금은 `WorkerError::{Cancelled, Panicked(String), ...}`이다 (docs/refactor/findings-fault-injection.md 4e)."
      - "2026-10-20 기준: `TaskRunner`/`PooledTaskRunner`의 `Result<T, String>`과 `use_async`의 `Err(\"Task panicked\")`가 panic과 앱 오류를 한 String으로 섞고, shutdown 구분이 없다. revue 자신의 release profile이 `panic = \"abort\"`라 revue의 예제와 CLI release build에서는 모든 `catch_panic`이 아무 일도 하지 않는다 (Cargo.toml)."
  - id: REV-ASYNC-007
    title: "Runtime Lock-In"
    category: async
    review_tag: ASYNC
    status: hypothesis
    assumes: [workers, public-api]
    decisions: ["#1143"]
    summary: "Tokio 또는 특정 executor 타입이 public API 전반에 노출된다. framework core는 executor-neutral하거나 integration feature로 분리하는 편이 안전하다."
    checked:
      - "2026-10-20: tokio는 `async` feature 뒤에 있고 공유 runtime은 private module이다. 공개 API는 `Future`와 closure를 받고, tokio 없이 도는 내장 polling executor가 있다. 공개 signature에 tokio 타입이 없다."
