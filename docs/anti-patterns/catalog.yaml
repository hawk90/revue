    fix:
      - "hook마다 panic을 잡고 그 plugin을 끈다. 끈 plugin은 목록으로 볼 수 있다 (#1149)."
      - "hook은 짝을 맞춘다: mount가 실패하면 앞서 mount한 plugin을 unmount하고, mount되지 않은 plugin에는 tick을 보내지 않는다."
