# ---------------------------------------------------------------------------
# 안티패턴 항목
#   status / assumes / decisions : 위의 statuses, assumptions, 정한 이슈
#   summary  : 패턴이 무엇인지
#   problem  : 그래서 무엇이 깨지는지
#   detect   : 어디를 보면 발견되는지 (코드 모양, 검증 입력)
#   fix      : 방지 원칙과 revue의 방향
#   snippets : 코드/도식
#   observed : revue에서 일어난 사례와 근거 (status: observed)
#   checked  : 확인했지만 재현되지 않은 것, 코드 읽기로만 의심되는 것 (status: hypothesis)
#   rejected_because : status: rejected인 이유
# ---------------------------------------------------------------------------
entries:
  - id: REV-ARCH-001
    title: "Ratatui Wrapper Syndrome"
    category: architecture
    review_tag: ARCH
    status: hypothesis
    assumes: [cell-grid]
    decisions: ["#1148"]
    summary: "내부 구조는 외부 렌더링 library(Ratatui 등)의 호출을 포장한 수준인데 외부 API만 framework처럼 확장하는 패턴이다."
    problem:
      - "Revue만의 렌더링 모델이 불명확해진다."
      - "새로운 기능이 그 library의 abstraction에 종속된다."
      - "widget마다 library의 세부 구현이 노출된다."
      - "프레임워크가 아니라 거대한 helper collection이 된다."
    fix:
      - "Revue의 독립적인 runtime tree, layout, paint 계약을 정의한다."
      - "backend adapter와 framework semantic을 분리한다. backend 타입이 public API까지 침투하지 않도록 한다 (REV-ARCH-005)."
      - "revue는 자체 buffer, diff, crossterm backend를 유지하고 Ratatui에 의존하지 않는다. compat crate도 두지 않는다 (#1148)."
    checked:
