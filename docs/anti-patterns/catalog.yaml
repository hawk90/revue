      - "key 없이 맨 앞에 행을 넣으면 focus·선택·scroll이 한 칸씩 밀린다. 상태가 widget에 있는 동안 `.keyed()`는 절반만 효과가 있다 (docs/refactor/phase1-reconciliation.md)."
  - id: REV-TREE-004
    title: "Zombie Widget State"
    category: ui-tree
    review_tag: TREE
    status: observed
    assumes: [retained-tree, workers]
    decisions: ["#1141", "#1143"]
    summary: "tree에서 제거된 widget의 signal, callback, subscription, worker가 살아남는 패턴이다."
    problem:
      - "memory leak"
      - "제거된 widget에서 effect 실행"
      - "stale event 전달"
      - "background task가 종료되지 않음"
    fix:
      - "unmount 시 subscription 해제, worker·timer 취소, focus 반납, resource drop을 반드시 한다."
      - "state slot은 node와 함께 사라지고(INV-03), node의 task는 node가 제거될 때 취소된다 (#1141, #1143)."
    observed:
      - "View에 mount/unmount hook이 없고 task나 effect를 node에 묶는 장치가 없다. INV-03은 node 상태와 focus만 테스트하고 effect·task·timer는 확인하지 않는다 (docs/refactor/phase0-invariants.md)."
