  - id: REV-RENDER-005
    title: "Unicode Width Equals Character Count"
    category: render
    review_tag: RENDER
    status: observed
    assumes: [cell-grid]
    decisions: ["#1148"]
    summary: "`str.len()`이나 `chars().count()`를 화면 너비로 사용하는 패턴이다. 반드시 grapheme segmentation과 terminal display width를 기준으로 처리해야 한다."
    detect:
      - "깨지는 대상: 한글, CJK, emoji, combining character, zero-width character, wide glyph, grapheme cluster"
    fix:
      - "cell은 `char`가 아니라 grapheme cluster 하나를 담는다. ZWJ emoji, 결합 문자, 국기가 한 칸 단위로 맞는다 (#1148)."
      - "폭 table은 하나만 두고 measure와 paint가 같은 함수로 잰다 (#1148, REV-LAYOUT-008)."
    observed:
      - "terminal 감사(#930): 스크롤 표시 \"↑N\"을 `area.width - indicator.len() - 1`에 그린다. `↑`는 3바이트라 표시가 오른쪽 끝에서 한 칸이 아니라 세 칸 앞에서 끝나고, 같은 바이트 수로 너비를 검사해 좁은 영역에서는 두 칸 일찍 빠진다."
      - "`Cell`의 `symbol`이 `char`라 grapheme cluster를 한 칸에 담을 수 없다 (src/runtime/render/cell.rs, 4.0 설계 리뷰)."
      - "폭 table이 둘이었다: `utils::unicode::char_width`는 손으로 쓴 범위로 Miscellaneous Symbols와 Dingbats 전체(★ ✓ ☐ 등 388자)와 Hangul Jamo 전체를 2칸으로 셌고, `Text`/`RichText`는 `unicode-width`로 1칸으로 셌다. 같은 label이 위젯마다 다르게 그려지고 measure가 한 글자당 한 칸 넓었다 (#1026, #879). 3.12에서 `char_width`를 `unicode-width`로 바꾸고 위젯의 직접 호출을 없앴다. 글자 단위라 VS16이 붙은 ⚙️ 같은 sequence는 아직 글자 폭의 합이다: cell이 char 하나라 terminal에는 VS16 없는 ⚙가 가므로 1칸이 맞고, emoji 표시는 grapheme cell(#1148)과 #1167에서 다룬다."
  - id: REV-RENDER-006
    title: "Partial Wide-Character Overwrite"
    category: render
    review_tag: RENDER
    status: observed
    assumes: [cell-grid]
    decisions: ["#1148"]
    summary: "폭 2인 문자의 한쪽 cell만 덮어쓰는 패턴이다. buffer가 continuation cell 개념을 가져야 한다."
    problem:
      - "잔상"
      - "깨진 cursor 위치"
      - "diff renderer 불일치"
    detect:
      - "`for ch in text.chars() { ctx.set(x, y, Cell::new(ch)); x += char_width(ch) }`처럼 글자마다 `ctx.set`을 부르고 continuation cell을 쓰지 않는 루프"
      - "x를 글자 폭만큼 옳게 옮겨도 깨진다: 그 칸에는 앞서 채운 공백이 남고, terminal 출력은 continuation이 아닌 cell을 모두 쓰므로 wide glyph의 오른쪽 절반 위에 공백을 다시 쓴다"
    fix:
      - "revue의 buffer에는 continuation cell이 이미 있다(`Cell::continuation`, `Buffer::set`이 잘린 반쪽을 비운다). 문제는 widget이 그것을 쓰지 않는 것이다."
      - "3.12부터 `Buffer::set`/`RenderContext::set`이 폭 2 글자를 받으면 오른쪽 칸에 continuation을 직접 쓰고, 그 칸이 buffer·clip·영역 밖이면 반쪽 대신 공백을 그린다 (#974). 그래서 글자 폭만큼 x를 옮기는 루프는 그대로 맞다. x를 1씩 옮기는 루프는 여전히 틀린다(다음 글자가 오른쪽 반을 덮어 glyph가 지워진다): 폭만큼 옮기거나 `put_str_with`/`draw_text_clipped*`를 쓴다. `get_mut`으로 그리는 overlay는 `utils::overlay`의 helper를 쓴다."
      - "글자는 `RenderContext::draw_text_clipped*`(폭을 알고, continuation을 쓰고, 경계에서 wide glyph를 반으로 자르지 않는다)로 그린다. 한 글자씩 직접 그려야 하면 폭 2인 글자 다음 칸에 `Cell::continuation()`을 쓴다."
      - "4.0에서 Element는 글자를 paint context의 text helper로만 그린다 (#1148)."
    observed:
      - "log_viewer에 \"한글ab\"를 그려 terminal 출력을 보면 `한` 다음에 커서를 그 오른쪽 절반으로 옮겨 공백을 쓴다(`ESC[1;4H `): glyph가 지워진다."
      - "같은 패턴의 루프가 src/widget 아래 52개 파일에 있다(ASCII만 그리는 곳은 무해). 목록은 #974. filetree (#968), csv_viewer (#970), virtuallist (#972)는 감사 중에 고쳤다."
      - "continuation cell을 쓰는 루프도 오른쪽 끝에서 깨질 수 있다. RichText(`display/richtext/render.rs`)는 `x + 1 < area.width`일 때만 continuation을 쓰고, 영역의 마지막 칸에서 시작하는 폭 2 글자는 그대로 그린다. 오른쪽 반쪽이 영역 밖, 옆 widget의 칸을 덮는다. `Text`가 RichText로 그리므로 모든 Text가 같다 (richtext/text 감사, #974 댓글). `draw_text_clipped*`는 그 칸을 비운다."
      - "3.12 (#974): 공통 수정 뒤 x를 1씩 옮기던 곳을 찾아 고쳤다: Tree 아이콘, Breadcrumb 아이콘, Terminal 화면 model(폭 2 글자 두 칸, 마지막 칸이면 줄바꿈), Timeline 연결선, Avatar 머리글자, RichTextEditor 툴바, Switch emoji 뒤 공백, RouterLink, DeclarativeRouter 404, 차트 범례, json_viewer, ThemePicker, SortableList, Inspector, devtools state, `draw_text_overlay`, DebugOverlay 패널 경계. 찾은 방법: `.chars()` 루프에서 x를 `enumerate` index나 `+= 1`로 옮기는 곳을 모두 읽고, 숫자·ASCII 상수만 그리는 곳은 뺐다."
