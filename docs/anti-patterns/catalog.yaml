  - id: REV-RUST-007
    title: "Panic for User Input Error"
    category: rust
    review_tag: RUST
    summary: "CSS, terminal capability, malformed event, template 입력 오류에 `unwrap()`이나 `expect()`를 사용한다. framework는 사용자 애플리케이션보다 더 강한 panic discipline이 필요하다."
    detect:
      - "호출자 데이터의 float을 `sort_by(|a, b| a.partial_cmp(b).unwrap())`나 `.unwrap_or(Ordering::Equal)`로 정렬한다. `unwrap_or(Equal)`은 안전해 보이지만 NaN이 있으면 total order가 아니고, Rust 1.81부터 표준 sort가 이를 감지하면 panic한다"
      - "검증 입력: 정렬하는 값 수십 개 중 몇 개를 NaN으로 바꿔 넣는다 (`\"NaN\".parse::<f64>()`는 Ok다)"
    fix:
      - "float 정렬은 `f64::total_cmp`/`f32::total_cmp`로 한다. NaN은 한쪽 끝으로 간다."
      - "NaN이 의미가 없는 값(위치, 시간)은 받을 때 거르거나 거부한다."
    observed:
      - "datagrid 숫자 컬럼, gradient stop 위치, streamline layer 정렬이 NaN에서 total order panic, keyframe 시간은 `unwrap()` panic (#986). chart 통계는 NaN을 먼저 걸러서 안전하다."
      - "`HeatMap::from_flat`이 행×열보다 짧은 데이터에서 slice index panic (#993)."
