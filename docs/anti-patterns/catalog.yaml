  - id: REV-TEST-011
    title: "Behavior Changed Inside a Split"
    category: testing
    review_tag: TEST
    summary: "파일을 나누는 리팩터링 커밋이 기본값이나 동작을 같이 바꾼다. 리뷰는 코드가 옮겨졌다는 것만 보고, 바뀐 값은 큰 diff에 묻힌다. 분리 전후가 같다는 증명이 없으면 회귀가 '리팩터링'으로 들어간다."
    problem:
      - "옮기면서 다시 쓴 생성자나 함수에서 값이 바뀌어도 커밋 메시지와 PR에는 남지 않는다."
      - "기존 테스트가 그 값을 화면에서 확인하지 않으면 아무것도 실패하지 않는다. 필드만 읽는 빌더 테스트는 새 값에 맞춰 같이 고쳐진다."
    detect:
      - "분리 커밋의 diff에서 같은 필드 초기화가 `-  name: A,`와 `+  name: B,`로 나온다 (A != B)"
      - "분리 전후로 같은 설정·키 입력·크기에서 화면과 상태를 덤프해 비교한다"
    fix:
      - "분리 커밋은 문장을 그대로 옮기고, 동작 변경은 별도 커밋이나 PR로 낸다."
      - "분리 전에 덤프를 만들고 분리 후 비교한다. 비교 스크립트는 이전 출력을 지우고 실행해, 빌드가 실패했을 때 오래된 파일로 '같음'이 나오지 않게 한다."
      - "기본값은 필드가 아니라 화면에서 확인하는 테스트로 고정한다."
    observed:
      - "#271(2026-01-23, 큰 위젯 파일 분리)에서 TextArea의 기본값 6개가 바뀌었다: 찾기 일치 색 두 개, 커서 글자색, 줄 번호 색이 `None`이 되어 현재 일치와 다른 일치가 같게 그려지고 커서 글자가 흰 배경 위 기본색으로 그려진다 (#1007, textarea 감사). 같은 방법으로 #270·#272·#512를 비교한 결과 다른 위젯의 값은 바뀌지 않았다 (#512는 같은 값의 상수로 바꿨다)."
  - id: REV-TEST-012
    title: "Property Test That Never Reaches the Failing State"
    category: testing
    review_tag: TEST
    summary: "proptest의 입력 생성기가 코드의 한쪽 상태(오류, 경계, 빈 값)를 거의 만들지 못한다. 수천 번 돌아도 그 분기는 한 번도 지나지 않으므로, 그 분기가 틀려도 테스트는 통과한다."
    problem:
      - "생성기는 쉬운 입력(글자 몇 개, 작은 수)만 고르고, 오류가 나려면 특정한 단어나 조합이 필요하다."
      - "통과 횟수가 늘어도 덮는 상태는 늘지 않는다. 실패하지 않으니 아무도 모른다."
    detect:
      - "생성기가 만든 입력 중 문제의 상태(예: `is_valid()`가 false)에 이른 비율을 센다. 0이거나 거의 0이면 그 상태는 테스트되지 않는다"
      - "그 분기를 일부러 망가뜨려(sabotage) 실패하는 테스트가 있는지 본다"
    fix:
      - "어려운 상태에서 시작하게 한다: 시작 값을 그 상태를 포함한 목록에서 고르거나, 그 상태를 만드는 단어를 생성기에 넣는다."
      - "`prop_assume!`으로 상태를 거르는 대신 생성기가 그 상태를 직접 만들게 한다."
    observed:
      - "search_bar 감사(#930): 키 입력 proptest는 한 글자 키만 만들었는데, 잘못된 쿼리는 `sort:`에 잘못된 방향이 붙을 때만 생긴다. 그래서 유효한 쿼리로 돌아올 때 오류를 지우는 문장을 지워도 10,000번 통과했다. 시작 쿼리를 다섯 개(그중 둘은 잘못된 쿼리) 중에서 고르게 하자 그 sabotage가 잡혔다."
