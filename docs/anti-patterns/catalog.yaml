  - id: REV-RENDER-006
    title: "Partial Wide-Character Overwrite"
    category: render
    review_tag: RENDER
    summary: "폭 2인 문자의 한쪽 cell만 덮어쓰는 패턴이다."
    problem:
      - "잔상"
      - "깨진 cursor 위치"
      - "diff renderer 불일치"
      - "buffer가 continuation cell 개념을 가져야 한다."
    detect:
      - "`for ch in text.chars() { ctx.set(x, y, Cell::new(ch)); x += char_width(ch) }`처럼 글자마다 `ctx.set`을 부르고 continuation cell을 쓰지 않는 루프"
      - "x를 글자 폭만큼 옳게 옮겨도 깨진다: 그 칸에는 앞서 채운 공백이 남고, terminal 출력은 continuation이 아닌 cell을 모두 쓰므로 wide glyph의 오른쪽 절반 위에 공백을 다시 쓴다"
    fix:
      - "revue의 buffer에는 continuation cell이 이미 있다(`Cell::continuation`, `Buffer::set`이 잘린 반쪽을 비운다). 문제는 widget이 그것을 쓰지 않는 것이다."
      - "글자는 `RenderContext::draw_text_clipped*`(폭을 알고, continuation을 쓰고, 경계에서 wide glyph를 반으로 자르지 않는다)로 그린다. 한 글자씩 직접 그려야 하면 폭 2인 글자 다음 칸에 `Cell::continuation()`을 쓴다."
    observed:
      - "log_viewer에 \"한글ab\"를 그려 terminal 출력을 보면 `한` 다음에 커서를 그 오른쪽 절반으로 옮겨 공백을 쓴다(`ESC[1;4H `): glyph가 지워진다."
      - "같은 패턴의 루프가 src/widget 아래 52개 파일에 있다(ASCII만 그리는 곳은 무해). 목록은 #974. filetree (#968), csv_viewer (#970), virtuallist (#972)는 감사 중에 고쳤다."
      - "continuation cell을 쓰는 루프도 오른쪽 끝에서 깨질 수 있다. RichText(`display/richtext/render.rs`)는 `x + 1 < area.width`일 때만 continuation을 쓰고, 영역의 마지막 칸에서 시작하는 폭 2 글자는 그대로 그린다. 오른쪽 반쪽이 영역 밖, 옆 widget의 칸을 덮는다. `Text`가 RichText로 그리므로 모든 Text가 같다 (richtext/text 감사, #974 댓글). `draw_text_clipped*`는 그 칸을 비운다."
    source_labels: ["결과"]
