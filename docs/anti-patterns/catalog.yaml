  - id: REV-TREE-002
    title: "Mutable Tree Everywhere"
    category: ui-tree
    review_tag: TREE
    status: observed
    assumes: [retained-tree]
    decisions: ["#1140", "#1143", "#1149"]
    summary: "모든 subsystem이 UI tree를 직접 수정할 수 있는 구조다."
    problem:
      - "mutation 발생 지점을 추적할 수 없다."
      - "렌더 중 tree가 변경될 수 있다."
      - "invalidation 누락이 발생한다."
      - "devtools snapshot의 일관성이 깨진다."
    fix:
      - "변경은 요청 → transaction → commit → invalidation 순서로 한 곳을 지난다."
      - "runtime tree는 reconciler만 바꾼다. DomTree/DomNode는 공개 API가 아니고, plugin은 tree를 직접 바꾸지 못하며, tree는 UI thread가 소유한다 (#1140, #1146, #1149, #1143)."
    snippets:
      - lang: text
        code: |2
          Mutation Request
              ↓
          Tree Transaction
              ↓
          Commit
              ↓
          Invalidation
    observed:
      - "`DomRenderer::tree_mut`와 `DomTree::get_mut`가 공개이고 `DomNode` 필드가 모두 pub이라 누구나 index를 건너뛰고 node를 바꿀 수 있다."
      - "직접 수정이 실제 버그를 셋 만들었다: `node.meta.classes`를 바로 써서 `class_index`가, 같은 방식으로 `id_map`이, `parent.children`을 바로 써서 `child_index`/`sibling_count`가 낡아 `:nth-child`가 이전 frame 순서를 읽었다. `DomTree::apply_meta`/`set_children`으로 고쳤다 (docs/refactor/phase1-reconciliation.md)."
      - "invalidation 지점 다섯 곳이 조상 표시를 각자 손으로 하고, root 자신의 meta 변경은 반환값을 버려 빠졌다 (docs/refactor/findings-style-invalidation.md)."
  - id: REV-TREE-003
    title: "Widget Identity by Position"
    category: ui-tree
    review_tag: TREE
    status: observed
    assumes: [retained-tree]
    decisions: ["#1140", "#1141"]
    summary: "widget의 identity를 부모의 child index만으로 판단하는 패턴이다. `[A, B, C]`가 `[X, A, B, C]`가 되면 A·B·C를 모두 새로운 widget으로 취급한다."
    problem:
      - "input 상태 초기화"
      - "animation 재시작"
      - "scroll 위치 손실"
      - "불필요한 lifecycle 호출"
    detect:
