# Revue Framework Anti-Pattern Catalog
#
# 목적: 사람과 LLM이 같은 기준으로 코드 리뷰/설계 리뷰를 할 수 있게 하는 기계 판독용 카탈로그.
# 사용법과 관리 규칙은 README.md에 있다. 이 파일이 유일한 원본이다.
#
# 각 항목의 `status`가 그 항목이 revue에서 확인된 실패인지(observed), 아직 가설인지(hypothesis),
# revue에는 맞지 않는지(rejected)를 말한다. hypothesis 항목 하나만으로 설계 결정을 내리지 않는다.

meta:
  schema: revue.anti-patterns/v2
  language: ko
  updated: 2026-10-20
  history:
    - date: 2026-08-18
      event: "ChatGPT 대화 \"Revue 기술 스택 안티패턴\"에서 155개 항목을 가져왔다 (https://chatgpt.com/share/6a843f6f-64f8-83e9-a269-bb1cb8a7ba44)."
    - date: 2026-10-12
      event: "모듈 감사(#930) 중에 revue에서 나온 항목과 `observed` 근거를 더했다."
    - date: 2026-10-20
      event: "docs/refactor/와 architecture-review.md를 지웠다. 4.0 결정은 결정 이슈(#1140~#1150)에 있다."
    - date: 2026-10-20
      event: "4.0 설계 리뷰(#1151): 모든 항목을 코드·이슈·docs/refactor와 대조해 `status`·`assumes`·`decisions`를 붙이고, 새 항목을 더하고, 가져올 때 깨진 문장을 고쳤다."
  # 근거에 적힌 docs/refactor/*.md, docs/anti-patterns/architecture-review.md, docs/ARCHITECTURE.md는
  # 아래 commit의 판이다. 지운 뒤에도 이 주소로 연다: <base>/<경로>
  sources:
    commit: 8f9dcb2e850e85e04f252a388e52ed037fe57179
    base: https://github.com/hawk90/revue/blob/8f9dcb2e850e85e04f252a388e52ed037fe57179
    paths: ["docs/refactor/", "docs/anti-patterns/architecture-review.md", "docs/ARCHITECTURE.md"]

# ---------------------------------------------------------------------------
# status 값
# ---------------------------------------------------------------------------
statuses:
  - id: observed
    meaning: "revue에서 실제로 일어났다(지금 남아 있거나 고친 사례 포함). `observed`에 코드 위치, 이슈, PR, 측정 같은 근거가 있다."
  - id: hypothesis
    meaning: "revue에서 재현되지 않았다. 확인해 보니 없었거나, 코드 읽기로만 의심되거나, 아직 확인하지 않았다. 확인한 내용은 `checked`에 적는다."
  - id: rejected
    meaning: "확인해 보니 revue에는 맞지 않는다. 이유를 `rejected_because`에 남기고 항목은 지우지 않는다."

# ---------------------------------------------------------------------------
# assumes 값: 항목이 전제하는 구조. 그 구조가 없는 설계(예: immediate mode)에는 그 항목이 성립하지 않을 수 있다.
# ---------------------------------------------------------------------------
assumptions:
  - id: retained-tree
    meaning: "프레임 사이에 남는 runtime tree가 있고 node identity로 상태를 잇는다 (#1140)."
  - id: reactive
    meaning: "Signal/Computed/Effect가 읽은 값을 자동으로 추적한다 (#1140)."
  - id: layout-phase
    meaning: "reconcile 다음, paint 전에 layout 단계가 따로 있다 (#1140, #1144)."
  - id: css
    meaning: "stylesheet, selector, cascade로 스타일을 정한다 (#1144, #1145)."
  - id: cell-grid
    meaning: "출력은 terminal cell grid이고 escape sequence로 쓴다 (#1148)."
  - id: terminal-input
    meaning: "입력은 terminal에서 해석한 key/mouse event이고 keyboard가 기본이다."
  - id: ui-thread
    meaning: "UI thread 하나가 tree와 Signal을 소유하고 worker는 결과를 보낸다 (#1143)."
  - id: workers
    meaning: "runtime이 worker pool과 비동기 작업을 제공한다 (#1143)."
  - id: widget-library
    meaning: "framework가 많은 내장 widget을 제공한다."
  - id: public-api
    meaning: "외부 사용자가 semver로 의존하는 공개 crate다 (#1146, #1147)."
  - id: macros
    meaning: "proc macro나 macro_rules DSL이 있다."
  - id: plugins
    meaning: "앱 밖의 코드가 plugin으로 runtime에 붙는다 (#1149)."
  - id: hot-reload
    meaning: "실행 중에 stylesheet를 다시 읽는다 (#1149)."
  - id: cli
    meaning: "project와 파일을 만들어 주는 CLI와 template이 있다."
  - id: devtools
    meaning: "실행 중인 앱을 들여다보는 inspector/profiler가 있다 (#1149)."
  - id: animation
    meaning: "시간에 따라 바뀌는 값과 transition이 있다 (#1149)."

# ---------------------------------------------------------------------------
# 코드 리뷰 태그 (커밋/PR/리뷰 코멘트 접두사로 사용)
# ---------------------------------------------------------------------------
