    observed:
      - "plugin hook의 panic이 PluginRegistry와 App을 거쳐 풀려 앱이 죽었다. registry가 hook마다 `catch_panic`으로 잡고 plugin을 끄며 `disabled_plugins()`로 보이게 고쳤다. mount 실패가 앞서 mount한 plugin을 unmount하지 않았다(고침) (docs/refactor/findings-fault-injection.md 4e)."
      - "2026-10-20 기준: mount 실패 뒤 `PluginRegistry::tick`이 mount되지 않은 plugin도 돌린다."
