    fix:
      - "UI thread만 tree와 Signal을 바꾼다(INV-01). worker는 `Send` handle로 결과를 UI queue에 보내고 UI thread가 적용한다. 낡은 결과는 버린다 (#1143)."
      - "3.x에서는 다른 thread의 Signal set을 UI thread로 보낸다 (#873)."
    snippets:
      - lang: text
        code: |2
          Worker → Message → UI Thread Commit
    observed:
