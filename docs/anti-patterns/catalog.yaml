    summary: "성능 문제를 cache로 덮지만 cache가 언제 무효화되는지 정의하지 않는다. cache보다 먼저 다음을 정의해야 한다."
    fix:
      - "cache key"
      - "owner"
      - "version"
      - "dependency"
      - "invalidation source"
      - "maximum lifetime"
  - id: REV-RUST-001
    title: "`Arc<Mutex<...>>` Everywhere"
    category: rust
    review_tag: RUST
    summary: "ownership 설계를 피하려고 모든 객체를 공유 가변 상태로 만드는 패턴이다."
    problem:
      - "lock 순서 복잡성"
      - "runtime contention"
      - "API 의미 불명확"
      - "single-thread UI에도 동기화 비용"
      - "UI thread ownership과 cross-thread message를 기본으로 한다."
    source_labels: ["문제"]
  - id: REV-RUST-002
    title: "Interior Mutability as Architecture"
    category: rust
    review_tag: RUST
    summary: "`RefCell`, `Cell`, `Mutex`, `RwLock`이 국소 구현 수단이 아니라 framework 전반의 상태 전달 방식이 된다. borrow panic이나 lock 문제가 runtime에 나타난다."
  - id: REV-RUST-003
    title: "Trait Object Everywhere"
    category: rust
    review_tag: RUST
    summary: "모든 widget, style, event, callback을 `Box<dyn Trait>`로 처리한다."
    problem:
      - "allocation 증가"
      - "indirect call"
      - "downcast 요구"
      - "lifetime 단순화를 위해 `'static` 확산"
      - "capability 확인이 runtime으로 이동"
      - "enum, generic, arena, trait object를 역할별로 선택해야 한다."
    source_labels: ["장점도 있지만 과도하면"]
  - id: REV-RUST-004
    title: "Generic Type Explosion"
    category: rust
    review_tag: RUST
    summary: "반대로 모든 것을 generic으로 만들어 type과 compile time이 폭발한다."
    problem:
      - "오류 메시지가 수백 줄"
      - "generated type 이름이 지나치게 큼"
      - "incremental compile 저하"
      - "public API가 type gymnastics가 됨"
      - "framework boundary에서는 적절한 type erasure가 필요하다."
    source_labels: ["징후"]
  - id: REV-RUST-005
    title: "`'static` as Lifetime Escape Hatch"
    category: rust
    review_tag: RUST
    summary: "worker, callback, effect API가 모든 입력에 `'static`을 요구한다."
    problem:
      - "불필요한 `Arc`"
      - "clone"
      - "application state의 전역화"
      - "scoped component 구현 곤란"
    source_labels: ["결과"]
  - id: REV-RUST-006
    title: "Enum Variant Explosion"
    category: rust
    review_tag: RUST
    summary: "모든 widget과 event를 하나의 거대한 enum에 추가한다."
    problem:
      - "compile time 증가"
      - "match 수정 범위 확대"
      - "plugin 불가능"
      - "binary coupling"
      - "closed set과 open extension point를 구분해야 한다."
    source_labels: ["문제"]
  - id: REV-RUST-007
    title: "Panic for User Input Error"
    category: rust
    review_tag: RUST
    summary: "CSS, terminal capability, malformed event, template 입력 오류에 `unwrap()`이나 `expect()`를 사용한다. framework는 사용자 애플리케이션보다 더 강한 panic discipline이 필요하다."
  - id: REV-RUST-008
    title: "Error String Erasure"
    category: rust
    review_tag: RUST
    summary: "모든 오류를 `anyhow::Error`나 문자열 하나로만 노출한다. 내부에서는 편리하지만 public diagnostic에는 다음이 필요하다."
    fix:
      - "structured error kind"
      - "source location"
      - "widget path"
      - "property name"
      - "recovery action"
  - id: REV-RUST-009
    title: "Feature Flag Combinatorial Failure"
    category: rust
    review_tag: RUST
    summary: "feature가 많지만 일부 조합은 build되지 않는다."
    fix:
      - "default"
      - "no-default-features"
      - "minimal core"
      - "all-features"
      - "주요 pairwise combinations"
    source_labels: ["필수 CI"]
  - id: REV-RUST-010
    title: "MSRV Declaration Without Enforcement"
    category: rust
    review_tag: RUST
    summary: "Rust 1.87+ 등을 선언하지만 CI가 실제 최소 버전에서 build하지 않는다. MSRV는 문서가 아니라 테스트 계약이어야 한다."
  - id: REV-MEM-001
    title: "Arena Without Generation"
    category: memory
    review_tag: MEM
    summary: "node ID가 단순 index라서 제거 후 재사용된 slot을 오래된 handle이 참조한다. generational index가 필요하다."
  - id: REV-MEM-002
    title: "Permanent String Interning"
    category: memory
    review_tag: MEM
    summary: "동적 class, ID, user text를 영구 intern하여 메모리가 회수되지 않는다. intern 대상과 lifetime을 제한해야 한다."
  - id: REV-MEM-003
    title: "Unbounded Caches"
    category: memory
    review_tag: MEM
    summary: "다음 cache에 상한이 없다. LRU나 scope lifetime이 필요하다."
    fix:
      - "text layout"
      - "selector match"
      - "image"
      - "markdown parse"
      - "chart data"
      - "snapshot"
      - "theme"
      - "glyph"
  - id: REV-MEM-004
    title: "Buffer Reallocate on Every Resize"
    category: memory
    review_tag: MEM
    summary: "terminal resize마다 정확한 크기로 buffer를 다시 allocation한다. capacity reuse와 resize policy가 필요하다."
  - id: REV-MEM-005
    title: "Closure Capture Retains Application"
    category: memory
    review_tag: MEM
    summary: "effect나 callback closure가 전체 application state를 `Arc`로 capture해 일부 widget 제거 후에도 유지한다. devtools에서 retained object 또는 subscription owner를 볼 수 있어야 한다."
  - id: REV-DEV-001
    title: "Inspector Changes Observed Behavior"
    category: devtools
    review_tag: DEV
    summary: "inspector를 켰을 때 추가 render·layout·subscription으로 원래 성능 특성이 크게 바뀐다. 측정 overhead를 별도로 표시해야 한다."
  - id: REV-DEV-002
    title: "Profiler Without Causality"
    category: devtools
    review_tag: DEV
    summary: "“render 12ms”만 보여주고 왜 render됐는지 알려주지 않는다."
    fix:
      - "triggering event"
      - "changed signal"
      - "dirty subtree"
      - "effect chain"
      - "style invalidation reason"
    source_labels: ["필요"]
  - id: REV-DEV-003
    title: "Widget Tree Without Semantic State"
    category: devtools
    review_tag: DEV
    summary: "tree 구조만 보여주고 다음을 볼 수 없다."
    fix:
      - "bounds"
      - "computed style"
      - "focus state"
      - "clipping"
      - "dirty reason"
      - "render count"
      - "subscription"
      - "source location"
  - id: REV-DEV-004
    title: "DevTools Coupled to Private Struct Layout"
    category: devtools
    review_tag: DEV
    summary: "devtools가 내부 필드에 직접 접근해 core 리팩터링을 막는다. 관찰용 instrumentation API를 별도로 둔다."
  - id: REV-TEST-001
    title: "Snapshot-Only Testing"
    category: testing
    review_tag: TEST
    summary: "모든 UI correctness를 snapshot으로만 검증한다. snapshot은 최종 출력 회귀에는 좋지만 다음을 충분히 검증하지 못한다."
    fix:
      - "focus transition"
      - "event propagation"
      - "lifecycle"
      - "invalidation scope"
      - "effect ordering"
      - "cancellation"
  - id: REV-TEST-002
    title: "Snapshot Approval Fatigue"
    category: testing
    review_tag: TEST
    summary: "대규모 변경마다 수백 개 snapshot이 바뀌고 검토 없이 일괄 승인한다. semantic assertion과 snapshot 범위를 분리해야 한다."
  - id: REV-TEST-003
    title: "Host Terminal-Dependent Tests"
    category: testing
    review_tag: TEST
    summary: "개발자의 locale, terminal width, color capability에 따라 결과가 달라진다. virtual terminal과 고정 capability profile이 필요하다."
  - id: REV-TEST-004
    title: "No Model-Based Event Testing"
    category: testing
    review_tag: TEST
    summary: "input·focus·modal·scroll은 상태 머신 성격이 강하다. 명령 sequence를 생성해 invariant를 검증하는 property test가 유용하다."
    detect:
      - "focus는 최대 하나"
      - "hidden widget은 focused될 수 없음"
      - "modal 활성 중 background action 금지"
      - "scroll offset은 valid range 내부"
    source_labels: ["예"]
  - id: REV-TEST-005
    title: "No Fuzzing at Parser Boundary"
    category: testing
    review_tag: TEST
    summary: "CSS, escape sequence, markdown, CSV, JSON, tree-sitter 입력은 fuzzing 대상이다."
    fix:
      - "panic 없음"
      - "무한 loop 없음"
      - "allocation 상한"
      - "bounded recursion"
      - "deterministic result"
    source_labels: ["필수 invariant"]
  - id: REV-TEST-006
    title: "Testing Public Examples Manually"
    category: testing
    review_tag: TEST
    summary: "README와 tutorial 예제가 CI에서 compile되지 않는다. 문서 코드는 executable documentation이어야 한다."
  - id: REV-API-001
    title: "Release Number Inflation"
    category: api
    review_tag: API
    summary: "아주 잦은 release가 실제 stability와 동일하다고 인식되는 패턴이다. release 빈도보다 다음이 중요하다."
    fix:
      - "compatibility policy"
      - "deprecation window"
      - "migration guide"
      - "stability tier"
      - "feature maturity"
  - id: REV-API-002
    title: "Builder Method Is Forever"
    category: api
    review_tag: API
    summary: "실험 단계의 builder method도 즉시 stable public API가 된다. `experimental` module이나 feature gate를 활용해야 한다."
  - id: REV-API-003
    title: "Breaking Change Hidden as Fix"
    category: api
    review_tag: API
    summary: "동작 의미 변경을 bug fix release로 배포한다. UI framework에서는 visual·event semantic 변경도 compatibility 문제다."
  - id: REV-API-004
    title: "Prelude Pollution"
    category: api
    review_tag: API
    summary: "모든 trait, widget, extension을 `prelude::*`에 넣는다."
    problem:
      - "이름 충돌"
      - "API 발견성 저하"
      - "compile 영향 범위 증가"
      - "무엇이 어디서 왔는지 불명확"
      - "prelude에는 가장 안정적이고 필수적인 항목만 둔다."
    source_labels: ["결과"]
  - id: REV-API-005
    title: "Convenience API Bypasses Core Invariants"
    category: api
    review_tag: API
    summary: "shortcut API가 정상 lifecycle·validation·invalidation 절차를 우회한다. 모든 API는 동일한 내부 transaction path를 통과해야 한다."
  - id: REV-UX-001
    title: "Color-Only Meaning"
    category: ux
    review_tag: UX
    summary: "오류·경고·선택 상태를 색상만으로 표시한다. terminal 색상 제한과 색각 다양성을 고려해 문자, symbol, label도 사용한다."
  - id: REV-UX-002
    title: "No Keyboard Discoverability"
    category: ux
    review_tag: UX
    summary: "가능한 shortcut이 UI에 드러나지 않는다."
    fix:
      - "help overlay"
      - "command palette"
      - "contextual key hints"
      - "discoverable focus"
    source_labels: ["필요"]
  - id: REV-UX-003
    title: "Focus Invisible"
    category: ux
    review_tag: UX
    summary: "focused widget이 visual하게 구분되지 않는다. theme과 무관하게 최소 focus indicator contract가 필요하다."
  - id: REV-UX-004
    title: "Modal Focus Leak"
    category: ux
    review_tag: UX
    summary: "modal이 열린 상태에서 Tab이나 shortcut이 배경 widget으로 전달된다. modal은 독립 focus scope와 event boundary를 가져야 한다."
  - id: REV-UX-005
    title: "No Small-Terminal Strategy"
    category: ux
    review_tag: UX
    summary: "terminal 크기가 작아졌을 때 panic하거나 모든 정보가 겹친다. widget은 최소 크기와 degradation strategy를 가져야 한다."
    fix:
      - "hide secondary content"
      - "collapse panel"
      - "scroll"
      - "truncate"
      - "compact mode"
  - id: REV-UX-006
    title: "Truncation Without Signal"
    category: ux
    review_tag: UX
    summary: "텍스트가 잘렸지만 ellipsis나 scroll 가능 여부가 표시되지 않는다."
  - id: REV-UX-007
    title: "Mouse Hover as Persistent State"
    category: ux
    review_tag: UX
    summary: "mouse를 움직이지 않으면 hover UI가 계속 남거나 keyboard 사용 중에도 hover가 우선된다. keyboard와 mouse modality 전환 정책이 필요하다."
  - id: REV-SEC-001
    title: "Terminal Escape Injection"
    category: security
    review_tag: SEC
    summary: "사용자 문자열을 sanitize하지 않고 terminal에 출력한다. 로그·채팅·파일 viewer에서 escape sequence가 실행될 수 있다. 모든 외부 text는 control character 정책을 통과해야 한다."
  - id: REV-SEC-002
    title: "OSC Sequence Trust"
    category: security
    review_tag: SEC
    summary: "clipboard, hyperlink, title 변경 등 OSC sequence를 무제한 허용한다. capability와 opt-in 정책이 필요하다."
  - id: REV-SEC-003
    title: "Untrusted CSS Resource Exhaustion"
    category: security
    review_tag: SEC
    summary: "비정상적으로 깊은 selector, 거대한 grid, 많은 animation 등을 제한하지 않는다. parser 성공과 안전한 실행은 별개다."
  - id: REV-SEC-004
    title: "Recursive Input Stack Overflow"
    category: security
    review_tag: SEC
    summary: "깊게 중첩된 markdown, JSON, tree, CSS expression을 재귀로 처리한다. depth limit과 iterative traversal을 고려한다."
  - id: REV-SEC-005
    title: "Panic Leaves Terminal Corrupted"
    category: security
    review_tag: SEC
    summary: "panic 발생 후 raw mode, alternate screen, cursor 상태가 복구되지 않는다. 반드시 RAII terminal guard와 panic hook 복구 경로가 필요하다."
  - id: REV-DOC-001
    title: "Feature Documentation Without Mental Model"
    category: documentation
    review_tag: DOC
    summary: "API 예제는 많지만 다음 질문에 답하지 못한다. 프레임워크는 API reference보다 실행 모델 문서가 먼저다."
    fix:
      - "언제 render되는가?"
      - "state는 누가 소유하는가?"
      - "effect는 언제 실행되는가?"
      - "widget identity는 무엇인가?"
      - "event는 어떻게 전파되는가?"
      - "layout과 paint는 어떻게 구분되는가?"
  - id: REV-DOC-002
    title: "Happy-Path-Only Tutorial"
    category: documentation
    review_tag: DOC
    summary: "counter와 todo만 설명하고 실제 문제를 다루지 않는다."
    fix:
