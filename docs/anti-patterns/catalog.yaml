    observed:
      - "`App::run`은 사용자 handler를 먼저 부르고 그 `bool`로 다시 그릴지 정한다(src/core/app/event_loop.rs). `App`은 reactive module을 참조하지 않는다. `docs/ARCHITECTURE.md`의 \"Signal::set → Schedule Re-render\"는 사실이 아니다 (4.0 설계 리뷰, #1140)."
