# ---------------------------------------------------------------------------
# 안티패턴 항목
#   summary  : 패턴이 무엇인지
#   problem  : 그래서 무엇이 깨지는지 (증상 / 결과 / 징후)
#   detect   : 어디를 보면 발견되는지 (예시 / 취약 대상 / 검증 입력)
#   fix      : 방지 원칙과 개선 방향
#   snippets : 원문에 포함된 코드/도식 (등장 순서)
#   source_labels : 원문에서 각 목록에 붙어 있던 소제목 (예: "특히 위험한 대상") — 출처 보존용
# ---------------------------------------------------------------------------
entries:
  - id: REV-ARCH-001
    title: "Ratatui Wrapper Syndrome"
    category: architecture
    review_tag: ARCH
    summary: "내부 구조는 Ratatui 호출을 포장한 수준인데 외부 API만 framework처럼 확장하는 패턴이다."
    problem:
      - "Revue만의 렌더링 모델이 불명확해진다."
      - "새로운 기능이 Ratatui abstraction에 종속된다."
      - "widget마다 Ratatui 세부 구현이 노출된다."
      - "프레임워크가 아니라 거대한 helper collection이 된다."
    fix:
      - "Revue의 독립적인 `View Tree`, `Layout Tree`, `Paint Tree` 계약을 정의한다."
      - "backend adapter와 framework semantic을 분리한다."
      - "Ratatui 타입이 public API까지 침투하지 않도록 한다."
    source_labels: ["문제", "방지 원칙"]
  - id: REV-ARCH-002
    title: "Web Framework Mimicry"
    category: architecture
    review_tag: ARCH
    summary: "Vue·React·CSS 개념을 터미널 환경에 의미 검토 없이 그대로 복제하는 패턴이다."
    problem:
      - "터미널의 cell 기반 렌더링 특성과 충돌한다."
      - "구현 복잡도에 비해 사용자 가치가 낮다."
      - "API는 익숙하지만 동작은 예측하기 어려워진다."
    detect:
      - "DOM과 동일한 lifecycle을 흉내 낸다."
      - "터미널에서 의미 없는 CSS 속성을 계속 추가한다."
      - "브라우저 애니메이션 모델을 그대로 적용한다."
      - "mouse hover를 기본 UX로 가정한다."
    fix:
      - "Web-compatible이 아니라 terminal-native semantic을 우선한다."
      - "지원하지 않는 CSS는 명시적으로 거부한다."
      - "비슷하게 보이지만 다르게 동작하는 기능을 만들지 않는다."
    source_labels: ["예", "문제", "방지 원칙"]
  - id: REV-ARCH-003
    title: "Feature Checklist Framework"
    category: architecture
    review_tag: ARCH
    summary: "경쟁 프레임워크에 있는 기능을 계속 추가하면서 핵심 실행 모델을 안정화하지 않는 패턴이다."
    problem:
      - "widget 수는 증가하지만 기본 input·focus·scroll 조합이 불안정하다."
      - "새로운 기능은 많지만 기존 기능의 compatibility contract가 없다."
      - "README 기능표가 설계 우선순위를 결정한다."
    fix:
      - "correctness"
      - "composability"
      - "diagnosability"
      - "performance"
      - "feature breadth"
      - "순서로 개발한다."
    source_labels: ["징후", "방지 원칙"]
  - id: REV-ARCH-004
    title: "One Framework Does Everything"
    category: architecture
    review_tag: ARCH
    summary: "core crate가 다음을 모두 책임지는 패턴이다."
    problem:
      - "compile time과 dependency graph가 폭증한다."
      - "feature 간 결합도가 높아진다."
      - "semver 변경 범위가 지나치게 넓어진다."
      - "최소 애플리케이션도 무거워진다."
    fix:
      - "state management"
      - "widgets"
      - "CSS"
      - "animation"
      - "networking"
      - "worker pool"
      - "markdown"
      - "image"
      - "charts"
      - "IDE 기능"
      - "testing"
      - "devtools"
    source_labels: ["문제", "개선 방향"]
    snippets:
      - lang: text
        code: |2
          revue-core
          revue-render
          revue-layout
          revue-style
          revue-reactive
          revue-events
          revue-widgets
          revue-devtools
          revue-testing
          revue-extra-*
  - id: REV-ARCH-005
    title: "Public API Mirrors Internal Representation"
    category: architecture
    review_tag: ARCH
    summary: "내부 구현 편의를 위해 public API가 설계되는 패턴이다."
    detect:
      - "내부 enum을 그대로 공개한다."
      - "내부 node ID가 사용자 API에 노출된다."
      - "storage 방식 변경이 breaking change가 된다."
      - "backend buffer 타입을 public하게 반환한다."
    fix:
      - "public semantic type과 internal storage type을 구분한다."
      - "내부 최적화가 public API 변경 없이 가능해야 한다."
    source_labels: ["예", "방지 원칙"]
  - id: REV-TREE-001
    title: "Rebuild Everything Every Frame"
    category: ui-tree
    review_tag: TREE
    summary: "작은 상태 변경에도 전체 widget tree를 다시 생성하는 패턴이다."
    problem:
      - "allocation 증가"
      - "style 재계산"
      - "layout 재계산"
      - "widget identity 손실"
      - "focus와 scroll 상태 손실"
    fix:
      - "stable widget identity"
      - "subtree dirty flag"
      - "structural diff"
      - "layout invalidation 범위 관리"
    source_labels: ["문제", "방지 원칙"]
  - id: REV-TREE-002
    title: "Mutable Tree Everywhere"
    category: ui-tree
    review_tag: TREE
    summary: "모든 subsystem이 UI tree를 직접 수정할 수 있는 구조다."
    problem:
      - "mutation 발생 지점을 추적할 수 없다."
      - "렌더 중 tree가 변경될 수 있다."
      - "invalidation 누락이 발생한다."
      - "devtools snapshot의 일관성이 깨진다."
    source_labels: ["문제", "개선"]
    snippets:
      - lang: text
        code: |2
          Mutation Request
              ↓
          Tree Transaction
              ↓
          Commit
              ↓
          Invalidation
  - id: REV-TREE-003
    title: "Widget Identity by Position"
    category: ui-tree
    review_tag: TREE
    summary: "widget의 identity를 부모의 child index만으로 판단하는 패턴이다."
    problem:
      - "input 상태 초기화"
      - "animation 재시작"
      - "scroll 위치 손실"
      - "불필요한 lifecycle 호출"
    detect:
      - "이때 A·B·C를 모두 새로운 widget으로 취급한다."
    fix:
      - "명시적 key"
      - "stable node ID"
      - "keyed reconciliation"
    source_labels: ["예", "문제", "방지 원칙"]
    snippets:
      - lang: text
        code: |2
          before: [A, B, C]
          after:  [X, A, B, C]
  - id: REV-TREE-004
    title: "Zombie Widget State"
    category: ui-tree
    review_tag: TREE
    summary: "tree에서 제거된 widget의 signal, callback, subscription, worker가 살아남는 패턴이다."
    problem:
      - "memory leak"
      - "제거된 widget에서 effect 실행"
      - "stale event 전달"
      - "background task가 종료되지 않음"
    detect:
      - "unmount 시 subscription 해제"
      - "worker cancellation"
      - "timer cancellation"
      - "focus release"
      - "resource drop"
    source_labels: ["결과", "반드시 검증할 것"]
  - id: REV-TREE-005
    title: "Parent Knows Every Child Type"
    category: ui-tree
    review_tag: TREE
    summary: "container가 각 child widget의 구체 타입에 따라 분기하는 패턴이다."
    problem:
      - "widget 추가마다 core 수정"
      - "extension 불가능"
      - "visitor/match가 프로젝트 전체로 확산"
      - "closed-world architecture가 됨"
    fix:
      - "capability-based interface"
      - "layout intrinsic contract"
      - "paint contract"
      - "event contract"
    source_labels: ["문제", "개선"]
    snippets:
      - lang: rust
        code: |2
          match child {
              Widget::Text(..) => ...
              Widget::Table(..) => ...
              Widget::Input(..) => ...
          }
  - id: REV-TREE-006
    title: "Tree and Render Buffer Coupling"
    category: ui-tree
    review_tag: TREE
    summary: "UI node가 terminal buffer의 좌표와 cell을 직접 소유하거나 조작하는 구조다."
    problem:
