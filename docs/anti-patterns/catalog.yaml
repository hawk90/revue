  - id: REV-TEST-007
    title: "Whitespace-Blind Test Move Check"
    category: testing
    review_tag: TEST
    summary: "테스트를 옮기거나 합친 뒤 본문이 그대로인지를 공백을 모두 지우고 비교한다. 여러 줄 문자열 리터럴 안의 공백이 바뀐 것을 놓친다."
    problem:
      - "테스트를 중첩 mod로 옮기며 줄마다 들여쓰기를 붙이면 raw string 안쪽 줄도 들여써져 테스트 입력이 바뀐다."
