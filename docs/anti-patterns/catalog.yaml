  - id: REV-MEM-004
    title: "Buffer Reallocate on Every Resize"
    category: memory
    review_tag: MEM
    status: observed
    assumes: [cell-grid]
    decisions: ["#1148"]
    summary: "terminal resize마다 정확한 크기로 buffer를 다시 allocation한다. capacity reuse와 resize policy가 필요하다."
