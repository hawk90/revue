    scope: "Interaction / accessibility"
  - tag: SEC
    scope: "Security / terminal safety"
  - tag: DOC
    scope: "Documentation"

# ---------------------------------------------------------------------------
# 항상 성립해야 하는 설계 invariant. CI/리뷰에서 위반 여부를 확인한다.
# ---------------------------------------------------------------------------
invariants:
  - id: INV-01
    rule: "하나의 application에는 하나의 UI-thread mutation owner만 존재한다."
  - id: INV-02
    rule: "하나의 focus scope에는 최대 하나의 focused widget만 존재한다."
  - id: INV-03
    rule: "제거된 widget은 effect, task, timer, focus를 유지하지 않는다."
  - id: INV-04
    rule: "한 transaction 안에서 동일 effect는 불필요하게 중복 실행되지 않는다."
  - id: INV-05
    rule: "paint는 layout bounds와 clipping bounds를 벗어나지 않는다."
  - id: INV-06
    rule: "변경되지 않은 subtree는 style/layout/paint되지 않는다."
  - id: INV-07
    rule: "외부 입력은 terminal control sequence로 직접 출력되지 않는다."
  - id: INV-08
    rule: "worker result는 생성 당시 generation과 일치할 때만 적용된다."
  - id: INV-09
    rule: "panic 또는 정상 종료 후 terminal state는 복구된다."
  - id: INV-10
    rule: "experimental API는 stable namespace에 자동 편입되지 않는다."

# ---------------------------------------------------------------------------
# 리뷰에서 반복해서 던져야 하는 질문. 개별 문법 지적보다 우선한다.
# ---------------------------------------------------------------------------
review_questions:
  - "이 상태 변경이 왜 이 subtree를 다시 그리는가?"
  - "이 widget의 identity와 lifetime은 누가 관리하는가?"
  - "이 CSS 변경이 왜 layout까지 무효화하는가?"
  - "이 task의 결과는 widget이 제거된 뒤 어디로 가는가?"
  - "이 event는 누가 소비하고 어디까지 전달되는가?"
  - "이 cache는 어떤 dependency가 바뀔 때 무효화되는가?"

