  - id: REV-ASYNC-002
    title: "Unbounded Work Queue"
    category: async
    review_tag: ASYNC
    status: observed
    assumes: [workers]
    decisions: ["#1143"]
    summary: "worker pool의 submit queue나 thread 수에 제한이 없다."
    problem:
      - "사용자 입력 반복으로 task 폭증"
      - "memory growth"
      - "오래된 검색 결과가 뒤늦게 반영"
      - "shutdown 지연"
    fix:
      - "bounded queue"
      - "backpressure"
      - "replace-latest"
      - "coalescing"
      - "rejection policy"
      - "runtime 소유 worker pool 하나만 thread를 만든다. 크기는 min(core 수, 약 4), queue는 대상마다 합치고 차면 알리며 거절한다 (#1143, INV-15)."
    observed:
      - "2026-10-20: queue는 제한이 있다: WorkerPool 1000, PooledTaskRunner `sync_channel(1000)`, 둘 다 차면 거절한다. 거절한 task가 영원히 pending으로 남던 것은 고쳤다 (docs/refactor/findings-fault-injection.md 4e)."
      - "thread는 제한이 없다: `TaskRunner::spawn`, `WorkerHandle::spawn*`, `use_async` trigger가 호출마다 OS thread를 하나씩 만든다. WorkerPool 기본 크기가 `available_parallelism()`이고 공유 tokio runtime이 그만큼 더 만든다. 같은 id로 실행 중이면 `TaskRunner::spawn`이 새 요청을 버리고 오래된 것을 남긴다(replace-latest의 반대)."
  - id: REV-ASYNC-003
    title: "Detached Task Without Cancellation"
    category: async
    review_tag: ASYNC
    status: observed
    assumes: [workers, retained-tree]
    decisions: ["#1143"]
    summary: "widget이 사라지거나 query가 변경되어도 task가 계속 실행된다. search \"a\", \"ab\", \"abc\"를 차례로 내면 세 작업이 모두 실행되고 가장 오래된 결과가 마지막에 UI를 덮을 수 있다."
    problem:
      - "오래된 결과가 새 결과를 덮는다."
      - "사라진 widget을 위한 작업이 CPU와 thread를 계속 쓴다."
    fix:
      - "cancellation token"
      - "generation ID: 결과는 생성 당시 generation과 맞을 때만 적용한다 (INV-08)."
      - "stale-result rejection"
      - "scope-owned task: node의 task는 node가 제거될 때 취소된다 (#1143)."
    snippets:
      - lang: text
        code: |2
          search "a"
          search "ab"
          search "abc"
    observed:
      - "fault injection이 찾아 고쳤다: `TaskRunner::cancel`이 id만 잊어 이전 thread의 결과가 같은 id의 새 실행에 전달되었고, `use_async`를 두 번 부르면 오래된 실행이 새 결과를 덮었으며, tokio 아래 `WorkerHandle`이 `cancel()`을 무시했고, WorkerChannel의 cancel이 queue가 차면 사라졌다 (docs/refactor/findings-fault-injection.md 4e)."
      - "2026-10-20 기준: 실행 중인 thread는 멈출 수 없다(`WorkerConfig.default_timeout_ms`는 \"읽히지 않음\"으로 deprecated). task를 node에 묶는 장치가 없다. INV-08은 generation 개념이 없어 테스트에서 빠져 있다 (docs/refactor/phase0-invariants.md)."
  - id: REV-ASYNC-004
    title: "UI State Mutated from Worker Thread"
    category: async
    review_tag: ASYNC
    status: observed
    assumes: [workers, ui-thread]
    decisions: ["#1143"]
    summary: "worker가 signal이나 widget state를 직접 변경한다. worker는 message로 결과를 보내고 UI thread가 그것을 commit해야 한다."
