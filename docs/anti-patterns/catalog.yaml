    category: performance
    review_tag: PERF
    status: observed
    assumes: []
    decisions: ["#1140"]
    summary: "성능 문제를 cache로 덮지만 cache가 언제 무효화되는지 정의하지 않는다. dirty 표시를 해도 cache가 먼저 답하면 아무것도 다시 계산되지 않는다."
    fix:
      - "cache보다 먼저 cache key, owner, version, dependency, invalidation source, maximum lifetime을 정한다."
      - "무효화는 표시가 아니라 제거다: dirty 표시와 cache 제거를 한 함수에서 한다."
      - "4.0에서 무효화는 reactive 의존성에서 나온다 (#1140)."
    observed:
      - "`style_for_with_inheritance`가 dirty를 보기 전에 style cache에서 답해 node를 dirty로 표시해도 다시 계산되지 않았다. 깨끗한 root가 dirty 자손 위에서 탐색을 멈춰 첫 frame 뒤의 동적 class 변경이 모두 무시되었다. `subtree_dirty`와 명시적 cache 제거로 고쳤다 (docs/refactor/findings-style-invalidation.md)."
      - "`set_hover`가 들어가는 node의 cache만 지워 hover style이 떠난 node에 남았다 (docs/refactor/phase2-hit-test.md H-3). dirty rect가 widget 내용을 보지 못하는 \"바뀐 것 없음\" cache처럼 굴어 배포된 예제가 다시 그려지지 않았다 (#599, findings-render-pipeline.md F-1)."
