    summary: "collection widget이 선택을 항목의 식별자가 아니라 화면상의 위치(index)로만 들고, 목록이 바뀔 때(정렬, 필터, 삽입, 오래된 항목 잘라내기, 펼치기·접기) 그 위치를 다시 계산하지 않는다."
    problem:
      - "목록이 바뀐 뒤 같은 위치에 있는 다른 항목이 선택된다. 사용자는 선택을 옮긴 적이 없다."
