      - "2026-10-24: TextArea가 자기 줄·커서·undo를 버리고 `EditState`로 편집한다 (#1261). 공개 API의 char 열은 `char_index`/`pos_at_char`로 바꿔 유지했다. 남은 쌍: CodeEditor."
