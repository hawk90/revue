  - tag: EVENT
    scope: "Input / focus / command"
  - tag: WIDGET
    scope: "Widget API / composition"
  - tag: ASYNC
    scope: "Worker / task / cancellation"
  - tag: ANIM
    scope: "Animation / scheduling"
  - tag: MACRO
    scope: "Proc macro / generated code"
  - tag: PLUGIN
    scope: "Extension boundary"
  - tag: PERF
    scope: "Performance"
  - tag: MEM
    scope: "Memory / allocation"
  - tag: TEST
    scope: "Testing / fuzzing"
  - tag: API
    scope: "Public API / semver"
  - tag: UX
    scope: "Interaction / accessibility"
  - tag: SEC
    scope: "Security / robustness"
  - tag: DOC
    scope: "Documentation"
  - tag: PROJ
    scope: "Project operation"
  - tag: CLI
    scope: "CLI / templates"
  - tag: HOT
    scope: "Hot reload"
  - tag: RUST
    scope: "Rust-specific"
  - tag: DEV
    scope: "DevTools"

# ---------------------------------------------------------------------------
# 설계 invariant. 위반이 곧 버그다. `tests/e2e/invariants.rs`가 id로 참조한다.
#   applies: 지금(3.x)부터 지켜야 하는 것인지, 4.0 구조에서 지켜지는 것인지
# ---------------------------------------------------------------------------
invariants:
  - id: INV-01
    rule: "하나의 application에는 하나의 UI-thread mutation owner만 존재한다."
    applies: "3.x"
    decisions: ["#1143"]
  - id: INV-02
    rule: "하나의 focus scope에는 최대 하나의 focused widget만 존재한다."
    applies: "3.x"
    decisions: ["#1142"]
  - id: INV-03
    rule: "제거된 widget은 effect, task, timer, focus, state slot을 유지하지 않는다."
    applies: "3.x"
    decisions: ["#1141", "#1143"]
  - id: INV-04
    rule: "한 transaction 안에서 동일 effect는 불필요하게 중복 실행되지 않는다."
    applies: "3.x"
    decisions: ["#1140"]
  - id: INV-05
    rule: "paint는 layout bounds와 clipping bounds를 벗어나지 않는다."
    applies: "3.x"
    decisions: ["#1144"]
  - id: INV-06
    rule: "변경되지 않은 subtree는 style/layout/paint되지 않는다."
    applies: "3.x"
    decisions: ["#1140"]
  - id: INV-07
    rule: "외부 입력은 terminal control sequence로 직접 출력되지 않는다."
    applies: "3.x"
  - id: INV-08
    rule: "worker result는 생성 당시 generation과 일치할 때만 적용된다."
    applies: "3.x"
    decisions: ["#1143"]
  - id: INV-09
    rule: "panic 또는 정상 종료 후 terminal state는 복구된다."
    applies: "3.x"
  - id: INV-10
    rule: "experimental API는 stable namespace에 자동 편입되지 않는다."
    applies: "3.x"
    decisions: ["#1146"]
  - id: INV-11
    rule: "render는 상태를 읽기만 한다. layout에서 나오는 값(viewport에 맞춘 scroll offset 등)은 layout 단계가 고친다."
    applies: "4.0"
    decisions: ["#1141"]
  - id: INV-12
    rule: "inline(builder) 스타일은 자기가 지정한 모든 속성에서 stylesheet를 이긴다. 지정한 값이 기본값과 같아도 마찬가지다."
    applies: "3.x"
    decisions: ["#1145"]
  - id: INV-13
    rule: "node의 상태 방식(bind 또는 runtime slot)은 node가 사는 동안 바뀌지 않는다."
    applies: "4.0"
    decisions: ["#1141"]
  - id: INV-14
    rule: "클릭은 그 칸에 가장 위에 놓인 node가 받는다. hit test는 layout rect와 z-order로 하고, paint와 같은 결과를 낸다."
    applies: "4.0"
    decisions: ["#1142"]
  - id: INV-15
    rule: "revue 안에서 thread는 runtime의 worker pool만 만든다."
    applies: "4.0"
    decisions: ["#1143"]
  - id: INV-16
    rule: "제거된 node의 id는 새 node에 닿지 않는다. id를 다시 쓰면 generation으로 구분한다."
    applies: "4.0"
    decisions: ["#1140"]

# ---------------------------------------------------------------------------
# 리뷰에서 반복해서 던져야 하는 질문. 개별 문법 지적보다 우선한다.
# ---------------------------------------------------------------------------
review_questions:
  - "이 상태 변경이 왜 이 subtree를 다시 그리는가?"
  - "이 widget의 identity와 lifetime은 누가 관리하는가?"
  - "이 상태의 주인은 누구인가: app이 bind한 Signal인가, runtime slot인가?"
  - "이 render는 무엇을 쓰는가? 읽기만 하는가?"
  - "이 CSS 변경이 왜 layout까지 무효화하는가?"
  - "builder 값과 stylesheet 값이 부딪히면 어느 쪽이 이기는가? 기본값을 지정해도 그런가?"
  - "이 task의 결과는 widget이 제거된 뒤 어디로 가는가?"
  - "이 event는 누가 소비하고 어디까지 전달되는가?"
  - "이 cache는 어떤 dependency가 바뀔 때 무효화되는가?"
  - "이 기능을 실제로 부르거나 그 결과를 읽는 곳이 있는가?"

