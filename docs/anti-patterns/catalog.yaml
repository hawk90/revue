      - "깊이만이 아니라 작업량(크기)에도 상한을 둔다."
    observed:
      - "`var()` 치환이 깊이(16)만 제한하고 크기는 제한하지 않아, 단계마다 변수를 4번 부르는 값이 4^16으로 커졌다. 값마다 1MiB 작업 예산으로 고쳤다 (docs/refactor/findings-fault-injection.md 4c). terminal이 보고한 65535×65535에 `Buffer::resize`가 그대로 allocation했다. 한 변 16384, 1천만 cell로 제한했다 (4b)."
  - id: REV-SEC-004
    title: "Recursive Input Stack Overflow"
    category: security
    review_tag: SEC
    status: hypothesis
    assumes: []
    summary: "깊게 중첩된 markdown, JSON, tree, CSS expression을 재귀로 처리한다. depth limit과 iterative traversal을 고려한다."
    checked:
      - "2026-10-20: corpus에 10,000단 괄호, JSON, 따옴표, markup, 10,000단 `var()` 사슬을 넣어 8MB stack thread에서 돌렸고 stack overflow가 없었다(docs/refactor/findings-fault-injection.md 4c). HttpClient가 100,000단 JSON body를 그렸다(4d). JsonViewer parser는 256단 제한이 있다 (#860). 찾은 stack overflow는 입력이 아니라 reactive subscriber loop였다 (REV-REACT-003)."
  - id: REV-SEC-005
    title: "Panic Leaves Terminal Corrupted"
    category: security
    review_tag: SEC
    status: observed
    assumes: [cell-grid]
    summary: "panic 발생 후 raw mode, alternate screen, cursor 상태가 복구되지 않는다. 반드시 RAII terminal guard와 panic hook 복구 경로가 필요하다."
    observed:
      - "release profile이 `panic = \"abort\"`라 `Drop`이 돌지 않아 사용자가 raw mode, alternate screen, 숨은 cursor를 그대로 받았다. panic hook(src/runtime/render/terminal/panic_hook.rs, PR #597)과 `inv09_*` 테스트로 고쳤고, 한 번만 복구하기와 SIGTERM은 #749에서 더했다 (docs/refactor/phase0-invariants.md)."
      - "basic template의 `std::process::exit(0)`이 복구를 건너뛰었다 (#744)."
  - id: REV-SEC-006
    title: "Work Without a Budget"
    category: security
    review_tag: SEC
    status: observed
    assumes: []
    summary: "외부 입력이나 외부 도구에 달린 작업(확장, loop, 도구 대기)에 시간이나 양의 상한이 없다. panic보다 나쁘게, CPU를 붙잡거나 UI를 멈춘 채 아무 신호도 내지 않는다."
    problem:
      - "앱이 멈춘 것처럼 보이고 오류도 남지 않는다."
      - "테스트는 panic만 확인하므로 멈춤을 잡지 못한다."
    detect:
      - "입력 크기에 따라 반복 횟수가 커지는 loop, 외부 process의 출력을 끝까지 기다리는 read"
      - "검증 입력: 커지는 입력과 응답하지 않는 외부 도구에 시간 제한을 걸고 돌린다"
    fix:
      - "작업마다 크기나 시간 예산을 두고, 넘으면 멈추고 알린다."
      - "외부 도구는 process와 pipe 모두에 timeout을 건다."
    observed:
      - "`var()` 확장과 terminal widget의 tab loop가 panic 없이 CPU를 붙잡았다(\"멈춤 둘은 패닉보다 고약했다\"). clipboard 도구 대기에 timeout이 없었고, 첫 수정은 도구만 제한하고 pipe는 제한하지 않았다. 모두 고쳤다 (docs/refactor/findings-fault-injection.md 4c, 4d)."
  - id: REV-DOC-001
    title: "Feature Documentation Without Mental Model"
    category: documentation
    review_tag: DOC
    status: observed
    assumes: []
    decisions: ["#1140", "#1141", "#1142", "#1143", "#1144"]
    summary: "API 예제는 많지만 실행 모델을 설명하지 못하거나 틀리게 설명한다. 프레임워크는 API reference보다 실행 모델 문서가 먼저다."
    fix:
      - "실행 모델 문서가 답할 질문: 언제 render되는가? state는 누가 소유하는가? effect는 언제 실행되는가? widget identity는 무엇인가? event는 어떻게 전파되는가? layout과 paint는 어떻게 구분되는가?"
      - "4.0 결정(#1140~#1144)이 구현되면 그것에 맞춰 다시 쓴다."
    observed:
      - "2026-10-20: docs/ARCHITECTURE.md가 실행 모델을 틀리게 설명한다. `Signal`을 `Rc<RefCell<T>>`로 적지만 실제는 `Arc<RwLock<T>>`이고, \"Signal::set() → Schedule Re-render\"라고 적지만 다시 그리기는 handler의 `bool`이 정하며(REV-REACT-011), 없는 `on_key()` dispatch를 보여 준다 (docs/refactor/findings-event-dispatch.md). 배포된 예제가 다시 그려지지 않은 것(#599)이 사용자에게 보인 결과다."
  - id: REV-DOC-002
    title: "Happy-Path-Only Tutorial"
    category: documentation
    review_tag: DOC
    status: hypothesis
    assumes: []
    summary: "counter와 todo만 설명하고 실제 문제를 다루지 않는다."
    fix:
      - "필수 고급 문서: cancellation, error handling, large list, modal/focus, background task, testing, performance diagnosis, custom widget lifecycle"
    checked:
      - "2026-10-20: tutorial은 기본(getting-started, counter, todo, reactive, styling, forms)이지만 guide가 performance, testing, error-handling, task, focus trap을 다룬다."
  - id: REV-DOC-003
    title: "Unsupported Behavior Left Ambiguous"
    category: documentation
    review_tag: DOC
    status: observed
    assumes: [css]
    decisions: ["#1144"]
    summary: "CSS나 terminal 기능을 \"비슷하게 지원\"한다고만 쓰고 정확한 차이를 설명하지 않는다. compatibility matrix가 필요하다."
    fix:
      - "지원하는 CSS 부분집합을 문서로 정하고(#1144), 지원하지 않는 속성은 경고한다 (REV-STYLE-004)."
    observed:
      - "2026-10-20: STABILITY.md는 \"Spacing: padding, margin\"을 지원 CSS로 적고 features.yaml의 CSS 항목을 모두 stable이라 하지만, `docs/specs/features.yaml`은 \"padding is not applied\"라고 적는다."
  - id: REV-PROJ-001
    title: "Core and Showcase Develop at Same Pace"
    category: project
    review_tag: PROJ
    status: observed
    assumes: []
    decisions: ["#1146"]
    summary: "실제 core 안정성보다 새로운 showcase widget 개발이 더 빠르다. core quality gate를 통과한 뒤 feature를 추가해야 한다."
    fix:
      - "widget은 측정한 기준(matrix, sequence, fault injection, 4.0 계약)을 통과해야 stable이 된다 (#1146)."
    observed:
      - "배포된 counter와 todo 예제에서 key가 0 byte를 썼고(#599), CSS paint 속성은 root에만, layout 속성은 어디에도 닿지 않았으며, `:hover`를 부르는 곳이 없었다 (docs/refactor/findings-render-pipeline.md, phase2-hit-test.md). 그 사이 공개 widget은 131개가 되었고 v2 release가 172번 나갔다."
  - id: REV-PROJ-002
    title: "Number of Widgets as Primary KPI"
    category: project
    review_tag: PROJ
    status: observed
    assumes: []
    summary: "widget 개수가 framework 품질로 취급된다."
    fix:
      - "더 중요한 KPI: 조합 가능성, input latency, API stability, bug density, accessibility, large-data behavior, custom widget 작성 난이도"
    observed:
      - "2026-10-20: README.md가 \"100+ Widgets\"를 첫 기능으로 두 번 내세우고, 비교표 첫 행이 \"Widgets | 100+ | ~15 built-in\"이다."
  - id: REV-PROJ-003
    title: "No Architectural Decision Records"
    category: project
    review_tag: PROJ
    status: observed
    assumes: []
    summary: "retained mode, signal ownership, CSS semantic, threading 모델 같은 결정이 코드에만 남는다."
    fix:
      - "결정은 GitHub 결정 이슈로 남긴다: Why(context), Decision, Not doing(alternatives와 trade-off), Work(consequences). 코드와 이 카탈로그가 이슈를 가리킨다. 별도 ADR 파일은 두지 않는다 (예: #1140~#1151)."
    observed:
      - "threading 모델이 코드에만 있었고 문서와 달랐다: `Signal`은 `Arc<RwLock>`, ARCHITECTURE.md는 `Rc<RefCell>`, INV-01은 UI thread 하나. 결정이 Q8까지 미뤄져야 했다 (4.0 설계 리뷰). 3.0 계획은 `&self` 변경과 dispatcher의 순서를 거꾸로 잡았다 (docs/refactor/findings-event-dispatch.md)."
