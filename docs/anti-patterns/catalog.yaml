# Revue Framework Anti-Pattern Catalog
#
# 목적: 사람과 LLM이 같은 기준으로 코드 리뷰/설계 리뷰를 할 수 있게 하는 기계 판독용 카탈로그.
# 사용법은 README.md 참고. 사람이 읽는 판은 README.md, 아키텍처 논의는 architecture-review.md.
#
# 주의: 이 카탈로그는 "일어날 수 있는 실패 모드"의 목록이며, Revue 코드베이스에 대한
#       감사 결과가 아니다. 각 항목이 실제로 존재하는지는 별도로 확인해야 한다.

