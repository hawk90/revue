version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # The tag IS the pinned toolchain version used by the MSRV job (e.g. @1.87),
      # not an action release; bumping it breaks CI (see #670).
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
