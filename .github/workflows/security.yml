name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "deny.toml"
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      # `rustsec/audit-check` runs on Node 20, which GitHub is retiring, and
      # the action has no Node 24 release. Install the binary and run it.
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
