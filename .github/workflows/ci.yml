name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Every job only reads the repository. Codecov uploads with its own token.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # dorny/paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      standalone: ${{ steps.filter.outputs.standalone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'revue-macros/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - '.github/workflows/ci.yml'
            # Crates in this tree that are not workspace members, so none of the
            # root `cargo` jobs above ever build them.
            # The templates are built against this checkout, so a change to
            # the library can break them too.
            standalone:
              - 'revue-cli/**'
              - 'templates/**'
              - 'src/**'
              - 'revue-macros/**'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false
      - name: Verify Cargo.lock is current
        run: cargo fetch --locked
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `--all-targets` adds the tests, the examples and the benches. Those
      # carried ~200 lints that no CI configuration looked at until the backlog
      # was cleared; checking them here is what stops it coming back.
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # Feature combinations
  #
  # Everything above runs `--all-features`, so a `#[cfg(feature = ...)]` that is
  # wrong for a *smaller* set was never built. That is not hypothetical: the job
  # was added because `--no-default-features` had an ungated import that
  # `-D warnings` turns into an error, and nothing had ever compiled it.
  #
  # `--no-default-features` is the floor and `--all-features` is the ceiling;
  # the default set is what `test` uses via the crate's own defaults. Checking
  # the floor is what the other two cannot do.
  features:
    name: Feature Combinations
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy (no default features)
        run: cargo clippy --no-default-features -- -D warnings
      - name: test (no default features)
        run: cargo test --no-default-features

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, fmt, clippy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5f21b548deaf7778840b17f063ecb2721b5ffdeb # cargo-nextest
      # Report every failing test, not just the first: a platform-specific
      # break (Windows above all) usually fails several tests at once.
      - run: cargo nextest run --all-features --tests --no-fail-fast
      # nextest does not run doc examples, and `cargo doc` only builds them;
      # without this step a doc example can call an API that no longer
      # exists (#800).
      - name: Doc tests
        if: success() || failure()
        run: cargo test --all-features --doc

  standalone:
    name: Standalone Crates
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: revue-cli
      # revue-cli has its own [workspace] table and Cargo.lock; nothing in the
      # root workspace jobs touches it, so it gets the same fmt/clippy/test gate here.
      # tools/theme-builder is deliberately not here: it does not compile against the
      # current framework API (7 compile errors on main as of 2026-10-07; port or remove it first).
      - name: revue-cli
        working-directory: revue-cli
        run: |
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # The templates pin the released crate (`revue = "3.0.0"`), so building
      # them as committed only re-checks that release. Point each one at this
      # checkout instead: a change that breaks a template fails here, in the
      # PR that makes it, not after the next release.
      - name: templates
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/templates
        run: |
          for t in templates/*/; do
            echo "::group::$t"
            sed -i 's|^revue = .*|revue = { path = "../.." }|' "$t/Cargo.toml"
            (cd "$t" && cargo fmt -- --check && cargo clippy -- -D warnings)
            echo "::endgroup::"
          done
      # Likewise for the projects `revue new` writes (which ask for
      # `revue = "3.0"` from crates.io): generate each one outside the checkout
      # and build it against the checkout. The list is
      # PROJECT_TEMPLATES in revue-cli/src/templates.rs.
      - name: revue new
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/templates
        run: |
          (cd revue-cli && cargo build --locked --quiet --target-dir target)
          cli="$PWD/revue-cli/target/debug/revue"
          for t in basic dashboard todo chat; do
            echo "::group::revue new --template $t"
            dir="$RUNNER_TEMP/new-$t"
            "$cli" new "$dir" --template "$t" --no-git
            sed -i "s|^revue = .*|revue = { path = \"$GITHUB_WORKSPACE\" }|" "$dir/Cargo.toml"
            (cd "$dir" && cargo fmt -- --check && cargo clippy -- -D warnings)
            echo "::endgroup::"
          done

  coverage:
    name: Coverage
    needs: [changes, fmt, clippy]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Get full history for changed files
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@27cdd3237bf9a6a2b668f3bcbfaa06949ae17deb # cargo-llvm-cov
      # PR: Quick coverage check without report (run tests for coverage)
      - name: Coverage (PR)
        if: github.event_name == 'pull_request'
        run: cargo llvm-cov --all-features --tests --no-report --ignore-run-fail
      # Main: Full coverage with lcov for badge
      - name: Coverage (Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo llvm-cov --all-features --tests --lcov --output-path lcov.info --ignore-run-fail
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: MSRV (1.95)
    needs: [changes, fmt, clippy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned, not `stable`. On `stable` this job checked nothing about 1.95.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The MSRV covers every feature combination, so a dependency that raises
      # its own floor above it fails here, not in a consumer's build.
      # See CONTRIBUTING.md.
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked
      # Clippy on the MSRV too: its lints differ from the pinned toolchain's,
      # and a consumer building on 1.95 sees these warnings.
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings

  # The same rustdoc build CD runs. CD is not a PR check, so a broken
  # intra-doc link used to reach main unnoticed and fail every deploy after it.
  docs:
    name: Docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  typos:
    name: Typos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          config: .typos.toml

  # Aggregate gate: single required status check for branch protection.
  # Code jobs are path-filtered (skipped on docs-only PRs); rulesets treat a
  # skipped required check as *not satisfied*, which would block docs-only PRs
  # forever. This gate always runs and passes when every upstream job either
  # succeeded or was skipped, so the ruleset should require ONLY "CI Gate".
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, fmt, clippy, features, test, standalone, coverage, msrv, docs, typos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          FEATURES: ${{ needs.features.result }}
          TEST: ${{ needs.test.result }}
          STANDALONE: ${{ needs.standalone.result }}
          COVERAGE: ${{ needs.coverage.result }}
          MSRV: ${{ needs.msrv.result }}
          DOCS: ${{ needs.docs.result }}
          TYPOS: ${{ needs.typos.result }}
        run: |
          fail=0
          for pair in "changes:$CHANGES" "fmt:$FMT" "clippy:$CLIPPY" "features:$FEATURES" "test:$TEST" "standalone:$STANDALONE" "coverage:$COVERAGE" "msrv:$MSRV" "docs:$DOCS" "typos:$TYPOS"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "success" ] || [ "$res" = "skipped" ]; then
              echo "OK   $job = $res"
            else
              echo "FAIL $job = $res"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."

