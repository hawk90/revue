name: Publish

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish-macros:
    name: Publish revue-macros to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish revue-macros to crates.io
        run: |
          cd revue-macros
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish:
    name: Publish revue to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    needs: publish-macros
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The previous job's `cargo publish` saw revue-macros in the index, but
      # this runner can still be served an older copy (#1368).
      - name: Wait for revue-macros in the crates.io index
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "revue-macros") | .version')
          scripts/wait-for-crate.sh revue-macros "$version"
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          REVUE_RELEASE: "1"
