name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize Pages deployments: GitHub Pages allows only one active
# deployment per environment, so overlapping runs (e.g. several merges to
# main in quick succession) collide with "Deployment failed, try again
# later". Queue them instead, and let an in-progress deploy finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  docs:
    name: Build Docs
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build rustdoc
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      - name: Create index redirect
        run: echo '<html><head><meta http-equiv="refresh" content="0; url=revue/index.html"></head></html>' > target/doc/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/doc

  deploy-docs:
    name: Deploy Docs
    needs: docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
