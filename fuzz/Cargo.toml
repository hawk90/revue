[package]
name = "revue-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "Coverage-guided fuzzing of revue's parsers (cargo fuzz, nightly)"

[package.metadata]
cargo-fuzz = true

# A crate of its own, not in revue's workspace (the root excludes it)
[workspace]

[features]
default = ["markdown", "syntax-highlighting"]
# The targets that need these are behind the same cfg names as in
# tests/fault, whose targets file this crate includes
markdown = ["revue/markdown"]
syntax-highlighting = ["revue/syntax-highlighting"]

[dependencies]
libfuzzer-sys = "0.4"
revue = { path = "..", default-features = false }

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
test = false
doc = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false

