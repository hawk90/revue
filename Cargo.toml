[workspace]
members = ["revue-macros"]
# Standalone crates that live inside this tree but are not part of the
# workspace: cargo (and tools that run it per manifest, e.g. Renovate) fails
# on them with "current package believes it's in a workspace" otherwise.
exclude = [
    "playground",
    "templates/basic",
    "templates/counter",
    "templates/dashboard",
    "templates/form-app",
    "tools/theme-builder",
]
resolver = "2"

[package]
name = "revue"
version = "3.2.0"
edition = "2021"
rust-version = "1.88"
description = "A Vue-style TUI framework for Rust with CSS styling"
license = "MIT"
repository = "https://github.com/hawk90/revue"
homepage = "https://hawk90.github.io/revue"
documentation = "https://docs.rs/revue"
readme = "README.md"
keywords = ["tui", "terminal", "css", "reactive", "ui"]
categories = ["command-line-interface", "gui"]
include = [
    "build.rs",
    "src/**/*.rs",
    "src/runtime/style/themes/*.css",
    "Cargo.toml",
    "LICENSE*",
    "README.md",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]
exclude = [
    "revue-cli/",
    "references/",
    "playground/",
    "extensions/",
    "tools/",
    "docs/",
    "tree-sitter-revue-css/",
    ".claude/",
    ".github/",
    "CONTRIBUTING.md",
    "cliff.toml",
    "deny.toml",
    "lefthook.yml",
    "*.rlib",
    "badge",
    "spinner",
    "tabs",
]

[dependencies]
# ═══════════════════════════════════════════
# Terminal
# ═══════════════════════════════════════════
crossterm = "0.29"

# ═══════════════════════════════════════════
# Text & Unicode
# ═══════════════════════════════════════════
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
unic-emoji-char = "0.9"
textwrap = "0.16.4"

# ═══════════════════════════════════════════
# Markdown & Syntax (optional)
# ═══════════════════════════════════════════
pulldown-cmark = { version = "0.13.4", optional = true }

# Tree-sitter for syntax highlighting
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }

# ═══════════════════════════════════════════
# Image (Kitty Protocol, optional)
# ═══════════════════════════════════════════
image = { version = "0.25.10", optional = true }
base64 = { version = "0.23.1", optional = true }

# ═══════════════════════════════════════════
# Serialization & Config (optional)
# ═══════════════════════════════════════════
serde = { version = "1.0.229", features = ["derive"], optional = true }
toml = { version = "1.1.6", optional = true }
dirs = { version = "7.0", optional = true }

# ═══════════════════════════════════════════
# Utilities
# ═══════════════════════════════════════════
bitflags = "2.13.2"
arboard = { version = "3.6.1", optional = true }
notify = { version = "8.2", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

# ═══════════════════════════════════════════
# QR Code & HTTP & System (optional)
# ═══════════════════════════════════════════
qrcode = { version = "0.14.1", optional = true }
sysinfo = { version = "0.39.6", optional = true }
reqwest = { version = "0.13.5", features = ["json", "blocking"], optional = true }
similar = { version = "3.2.0", optional = true }
regex = { version = "1.13.1", optional = true }

# ═══════════════════════════════════════════
# Error Handling
# ═══════════════════════════════════════════
thiserror = "2.0.21"

# ═══════════════════════════════════════════
# Internal Macros
# ═══════════════════════════════════════════
# Internal Macros
revue-macros = { path = "revue-macros", version = "3.2.0" }
anyhow = "1.0.104"

# ═══════════════════════════════════════════
# Signals (unix): App::run shuts down cleanly on SIGTERM/SIGHUP/SIGINT.
# Both are already in the tree through crossterm.
# ═══════════════════════════════════════════
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3.18", default-features = false }
libc = "0.2.190"

[dev-dependencies]
insta = "1.48.0"
tokio-test = "0.4.6"
pretty_assertions = "1.4.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
tempfile = "3.27.0"
serial_test = "4.0"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "css"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "dom"
harness = false

[[bench]]
name = "widget"
harness = false

[[bench]]
name = "patterns"
harness = false

[[bench]]
name = "utils"
harness = false

[features]
# Default features - essential for most apps
default = [
    "async",
    "config",
]
# All features enabled (for examples/tests)
full = [
    "devtools",
    "async",
    "config",
    "tracing",
    "markdown",
    "syntax-highlighting",
    "image",
    "qrcode",
    "sysinfo",
    "diff",
    "clipboard",
    "hot-reload",
    "regex",
]
devtools = []

# Preset feature groups
std = ["async", "config", "tracing"]
gui = ["async", "config", "markdown", "image"]
all-gui = ["std", "syntax-highlighting", "qrcode", "sysinfo", "diff", "clipboard", "hot-reload"]

# Core optional features
async = ["dep:tokio"]
config = ["dep:serde", "dep:toml", "dep:dirs"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

# Heavy optional features
markdown = ["dep:pulldown-cmark"]
syntax-highlighting = [
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-go",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-md",
]
image = ["dep:image", "dep:base64"]
qrcode = ["dep:qrcode"]
sysinfo = ["dep:sysinfo"]
diff = ["dep:similar"]
# Real regex engine for TextArea find/replace (falls back to literal search when off)
regex = ["dep:regex"]
clipboard = ["dep:arboard"]
hot-reload = ["dep:notify"]
http = ["dep:reqwest"]

# Examples with required features
[[example]]
name = "showcase"
required-features = ["full"]

[[example]]
name = "slideshow"
required-features = ["markdown"]

[[example]]
name = "qrcode_generator"
required-features = ["qrcode"]

[[example]]
name = "qrcode_showcase"
required-features = ["qrcode"]

[dependencies.tokio]
version = "1.53.1"
features = ["rt-multi-thread", "macros", "time", "sync"]
optional = true

# Optimize for runtime speed (default release profile)
[profile.release]
strip = true              # Remove debug symbols
lto = true                  # Link-time optimization
codegen-units = 1         # Better optimization at cost of compile time
opt-level = 3              # Optimize for speed (was "z" for size)
panic = "abort"            # Reduce binary size

# Profile for size optimization (use with: cargo build --profile release-min-size)
[profile.release-min-size]
inherits = "release"
opt-level = "z"            # Optimize for size
strip = true

# Maintain debug info for profiling
[profile.release-debug]
inherits = "release"
debug = true
strip = false
