# Lefthook - Git hooks manager
# Install: brew install lefthook or cargo install lefthook
# Enable: lefthook install

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt -- --check
      fail_text: "Code is not formatted. Run 'cargo fmt' to fix."

    clippy:
      glob: "*.rs"
      run: cargo clippy --all-features -- -D warnings
      fail_text: "Clippy warnings found."

    check:
      run: cargo check --all-features
      fail_text: "Compilation errors found."

commit-msg:
  commands:
    commitlint:
      run: |
        # Validate the subject line against Conventional Commits, with the
        # same rules as the PR-title check in .github/workflows/community.yml
        # (a squash merge uses the PR title as the commit message):
        #   type(scope)?!?: description   (! marks a breaking change)
        # and the description must not start with a capital letter.
        # Only the first line counts - a matching line in the body is no excuse.
        SUBJECT=$(head -n 1 {1})
        # git's own merge commits (`git pull`, `git merge`) keep their message;
        # they never reach main, where every PR is squash-merged.
        case "$SUBJECT" in Merge\ *) exit 0 ;; esac
        if ! printf '%s\n' "$SUBJECT" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: [^A-Z].*$"; then
          echo "Commit subject does not follow Conventional Commits format:"
          echo "  $SUBJECT"
          echo ""
          echo "Expected format: <type>(<scope>)?: <description>"
          echo "The description must not start with a capital letter."
          echo "Examples:"
          echo "  feat: add new feature"
          echo "  fix(parser): resolve bug"
          echo "  docs: update documentation"
          echo "  refactor(api)!: remove a deprecated method"
          echo ""
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    doc:
      # Same flags as CI and CD: a broken intra-doc link is an error, not a warning.
      run: RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo doc --no-deps --all-features --document-private-items
      fail_text: "Documentation build failed. Check for broken intra-doc links or invalid code blocks."

    test:
      # Run tests for changed Rust files
      run: |
        CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.rs$' || true)
        if [ -n "$CHANGED" ]; then
          echo "Testing changed files:"
          echo "$CHANGED"
          # Run all tests if any src/ file changed
          if echo "$CHANGED" | grep -q "^src/"; then
            echo "Running all tests (src/ changed)..."
            cargo test --all-features || exit 1
          else
            # Run tests for specific test files that changed
            TEST_TARGETS=()
            for file in $CHANGED; do
              if echo "$file" | grep -qE "^tests/[^/]+/"; then
                # Test directories - run all tests
                echo "Test directory changed, running all tests..."
                cargo test --all-features || exit 1
                exit 0
              elif echo "$file" | grep -qE "^tests/[^/]+\.rs$" && [ -f "$file" ]; then
                # Top-level test files (e.g., tests/buffer_tests.rs); a deleted
                # one is no longer a target
                test_name=$(basename "$file" .rs)
                TEST_TARGETS+=("--test" "$test_name")
              fi
            done
            if [ ${#TEST_TARGETS[@]} -gt 0 ]; then
              echo "Running test targets: ${TEST_TARGETS[*]}"
              cargo test "${TEST_TARGETS[@]}" --all-features || exit 1
            fi
          fi
        else
          echo "No Rust files changed, skipping tests"
        fi
      fail_text: "Tests failed."

    coverage:
      # Quick coverage check for changed src files (local only)
      run: |
        CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^src/' || true)
        if [ -n "$CHANGED" ]; then
          echo "📊 Running coverage check..."
          # This will fail if any tests fail
          cargo llvm-cov --lib --no-report
        fi
      fail_text: "Coverage check failed. Tests did not pass successfully."
      skip: [ -n "$CI" ]  # Skip in CI, only run locally

# --- keep local deps in sync with the lockfiles after pull / checkout / rebase ---
post-merge:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh
post-checkout:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh --since {1}
post-rewrite:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh
